<script>
/* ===== «تحديث البرنامج» button in the حسابي (profile) screen ===== */
(function(){
try{
var APK_URL='https://amersn.github.io/shehabpharmacies/ShehabPharmacies.apk';
function el(s){return document.querySelector(s)}
function isAndroid(){try{return /android/i.test(navigator.userAgent||'')}catch(e){return false}}
function nativeHas(m){try{return !!(window.ShehabAndroid&&typeof window.ShehabAndroid[m]==='function')}catch(e){return false}}
function escx(v){try{if(typeof esc==='function')return esc(v)}catch(e){}return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function say(msg){try{if(typeof toast==='function'){toast(msg);return}}catch(e){}try{alert(msg)}catch(e){}}
function appUpdate(){
  try{
    if(nativeHas('checkUpdate')){
      var r='';
      try{r=String(window.ShehabAndroid.checkUpdate()||'').trim()}catch(e){r=''}
      if(r==='update'){
        say('جاري تنزيل النسخة الجديدة… بعد ما تخلص هيطلب منك تسطيبها');
        try{window.ShehabAndroid.startUpdate()}catch(e){}
        return;
      }
      if(r==='none'){say('إنت على أحدث إصدار ✅');return}
      say('تعذّر فحص التحديث دلوقتي — تأكد من الإنترنت وجرّب تاني');
      return;
    }
    if(window.ShehabAndroid){
      say('لو في نسخة أحدث هيظهرلك زر «تحديث» أزرق أسفل الشاشة — اضغطه.');
      return;
    }
    say(isAndroid()?'هنفتحلك صفحة تنزيل نسخة الأندرويد…':'نسخة الأندرويد بس هي اللي بتتحدّث من هنا.');
    if(isAndroid()){try{window.open(APK_URL,'_blank')}catch(e){try{location.href=APK_URL}catch(e2){}}}
  }catch(e){}
}
window.appUpdate=appUpdate;
var pvBase=profileV;
profileV=async function(){
  await pvBase();
  try{
    var p=el('#profile');
    if(!p||el('#appUpdateBox'))return;
    if(!window.ShehabAndroid&&!isAndroid())return;
    var box=document.createElement('div');
    box.className='profile-field';
    box.id='appUpdateBox';
    var ver='';
    try{if(nativeHas('appVersion'))ver=String(window.ShehabAndroid.appVersion()||'').trim()}catch(e){}
    box.innerHTML='<h3 style="margin:6px 0">تحديث البرنامج</h3>'+
      (ver?'<small>النسخة اللي عندك: '+escx(ver)+'</small>':'')+
      '<small>اضغط الزر علشان نشوف لو في نسخة أحدث وننزّلها ونثبّتها لك من جوه التطبيق.</small>';
    var b=document.createElement('button');
    b.type='button';b.className='g';b.id='appUpdateBtn';

      try{appUpdate()}catch(e){}
      setTimeout(function(){b.disabled=false;b.textContent='⬆️ تحديث البرنامج'},2500);
    });
    box.appendChild(b);
    p.appendChild(box);
  }catch(e){}
};
}catch(e){}
})();
</script>

<script>
/* =====================================================================
   إصلاحات شاشة الإشعارات + زر الرجوع
   ---------------------------------------------------------------------
   1) سبب «التعليق»: زر الرجوع كان يرجّع «نسخة HTML قديمة» للشاشة السابقة
      من غير ما يشغّل التحميل تاني. فلو النسخة دي كانت متاخدة وقت إن
      الشاشة لسه بتحمّل، ترجع عالقة على «جاري التحميل…» للأبد.
      الحل: بعد الرجوع نعمل re-render للشاشة (من الكاش = سريع).
   2) شاشة الإشعارات كانت تستنى رد السيرفر قبل ما تعرض أي حاجة، وبتحمل
      ملف واحد لكل نداء. الحل: نعرض المحفوظ على الموبايل فورًا، وبعدين
      نحدّث من السيرفر بمُهلة (12 ثانية) وبطلب واحد مش مكرر.
   3) الضغط على إشعار كان يستنى السيرفر قبل ما يفتح العرض. الحل: يفتح
      فورًا، ويعلّم «مقروء» في الخلفية.
   ===================================================================== */
(function(){
  var escx=function(x){ try{ return esc(x) }catch(e){ return String(x==null?'':x) } };
  var fmtx=function(d){ try{ return fmt(d,{dateStyle:'medium',timeStyle:'short'}) }catch(e){ return '' } };

  /* ---------- (1) زر الرجوع: أعد بناء الشاشة بدل استرجاع نسخة قديمة ---------- */
  try{
    var prevPop=onpopstate;
    onpopstate=function(e){
      try{ if(typeof prevPop==='function') prevPop(e) }catch(_e){}
      var v='home';
      try{ v=(e&&e.state&&e.state.appView)||(location.hash||'').slice(1)||'home' }catch(_e){ v='home' }
      try{ V=v }catch(_e){}
      try{
        var r=(typeof S!=='undefined'&&S.r)?S.r:'customer';
        if(v==='off')offV();
        else if(v==='mine'){ if(r==='customer')mineV(); else listV() }
        else if(v==='list')listV();
        else if(v==='profile')profileV();
        else if(v==='notifications')notificationCenter();
        else if(v==='notify')notifV();
        else if(v==='sec'){ try{ if(typeof window.secScreenV==='function')window.secScreenV(window.__shLastSecId||'') }catch(_e){ homeV() } }
        else if(v==='secItem'){ try{ if(window.__shLastSecItemId&&typeof window.secItemV==='function')window.secItemV(window.__shLastSecItemId); else homeV() }catch(_e){ homeV() } }
        else if(v==='mydata'){ try{ if(typeof window.myDataV==='function')window.myDataV(); else profileV() }catch(_e){ profileV() } }
        else if(v==='notifSettings'){ try{ if(typeof window.notifSettingsV==='function')window.notifSettingsV(); else profileV() }catch(_e){ profileV() } }
        else if(v==='search'){ try{ if(typeof window.searchV==='function')window.searchV(window.__shLastSearch||''); else homeV() }catch(_e){ homeV() } }
        else if(v==='cart')cartV();
        else if(v==='monthly')monthlyV();
        else if(v==='monthlyAll')monthlyAdminV();
        else if(v==='broadcast')broadcastV();
        else if(v==='offer'){ if(window.__shLastOfferId)offerV(window.__shLastOfferId,true); else offV() }
        else if(v==='auth')authV();
        else homeV();
      }catch(_e){}
      try{ navSync() }catch(_e){}
    };
  }catch(e){}

  /* ---------- (2) صندوق الإشعارات: طلب واحد + مُهلة عشان ما يعلّقش ---------- */
  try{
    var prevInbox=fetchServerInbox, inflight=null;
    fetchServerInbox=function(){
      if(inflight) return inflight;
      var real=(async function(){ try{ return await prevInbox() }catch(e){ return null } })();
      var raced=Promise.race([ real, new Promise(function(res){ setTimeout(function(){ res(null) },12000) }) ]);
      inflight=raced;
      real.then(function(){ inflight=null }, function(){ inflight=null });
      return raced;
    };
  }catch(e){}

  /* ---------- (2ب) شاشة الإشعارات: نعرض المحلي فورًا وبعدها السيرفر ---------- */
  var rowsHtml=function(list){
    if(!list.length) return '<div class="card">لا توجد إشعارات حتى الآن. ستظهر هنا عند وصول تحديثات جديدة.</div>';
    return list.map(function(x){
      return '<div class="card" style="border-color:'+(x.read?'#c9d3ea':'#0b2a6f')+'" onclick="noticeTap(\''+escx(x.id)+'\',\''+escx(x.url||'')+'\',\''+encodeURIComponent(x.title||'')+'\',\''+encodeURIComponent(x.body||'')+'\')"><b>'+escx(x.title)+'</b><br><span>'+escx(x.body)+'</span><br><small>'+fmtx(x.date)+(x.read?'':' · جديدة')+(x.url?' · اضغط لفتح العرض 🔗':'')+'</small></div>';
    }).join('');
  };
  try{
    notificationCenter=async function(){
      V='notifications';
      app('<h2>🔔 الإشعارات</h2><div id="noticePermission"></div><div id="noticeList">جاري تحميل الإشعارات…</div><button class="g" id="markNoticesRead" onclick="markAllNoticesRead()" hidden>تحديد الكل كمقروء</button>');
      var p=document.getElementById('noticePermission'), supported=false, permission='unsupported', registered=false;
      try{ supported=('Notification' in window)&&('serviceWorker' in navigator); permission=supported?Notification.permission:'unsupported'; registered=localStorage.getItem('shehab_push_enabled')==='1' }catch(e){}
      if(p){
        if(!supported){ p.innerHTML='<div class="card">هتوصلك التنبيهات كإشعار على الموبايل من التطبيق، وهنا بتلاقي كل الإشعارات.</div>' }
        else{ p.innerHTML='<div class="card">'+(registered?'✅ تم تسجيل هذا الجهاز لاستقبال الإشعارات.':permission==='granted'?'إذن الجهاز مسموح، لكن ربطه بالإشعارات لم يكتمل. اضغط الزر لاستكماله.':'إشعارات الجهاز غير مفعّلة. اضغط الزر لتفعيلها.')+'</div><button class="g" id="enableNoticesButton" onclick="enableShehabPush(this)">'+(permission==='granted'?'🔄 استكمال أو تحديث تفعيل الإشعارات':'🔔 تفعيل الإشعارات')+'</button>' }
      }
      var localRows=[];
      try{ localRows=(await listPushNotifications()).map(function(x){return {id:'l:'+x.id,title:x.title,body:x.body,date:x.date,read:!!x.read,url:''} }) }catch(e){}
      var box=document.getElementById('noticeList');
      if(box&&localRows.length) box.innerHTML=rowsHtml(localRows);      /* عرض فوري للي على الموبايل */
      var srv=null;
      try{ srv=await fetchServerInbox() }catch(e){ srv=null }
      box=document.getElementById('noticeList'); if(!box) return;         /* المستخدم خرج من الشاشة خلاص */
      var rows=(srv!==null)?srv.map(function(x){return {id:'s:'+x.id,title:x.title,body:x.body,date:x.date,read:!!x.read,url:x.url||''}}):localRows;
      box.innerHTML=(srv===null&&!rows.length)?'<div class="card">تعذر تحميل الإشعارات دلوقتي. اضغط 🔔 تاني للمحاولة.</div>':rowsHtml(rows);
      var m=document.getElementById('markNoticesRead'); if(m) m.hidden=!rows.some(function(x){return !x.read});
      try{ if(window.ShehabAndroid&&ShehabAndroid.notificationsEnabled&&!ShehabAndroid.notificationsEnabled()){ var np=document.getElementById('noticePermission'); if(np) np.innerHTML+='<div class="card" style="border-color:#d32f2f">⚠️ إشعارات النظام مرفوضة لهذا التطبيق، فمش هيوصلك تنبيه على الموبايل. اضغط الزر لتفعيلها.</div><button class="g" onclick="try{ShehabAndroid.openNotificationSettings()}catch(e){}">⚙️ فتح إعدادات الإشعارات</button>' } }catch(e){}
    };
  }catch(e){}

  /* ---------- (3) فتح الإشعار فورًا + تعليم مقروء في الخلفية ---------- */
  function markLocalRead(id){
    try{
      id=String(id);
      if(id.indexOf('s:')===0){ call('inboxRead',{id:id.slice(2)}).then(function(){bustInbox()}).catch(function(){}); return }
      if(id.indexOf('l:')===0){
        var lid=id.slice(2);
        noticeDb().then(function(db){
          var tx=db.transaction('items','readwrite'), s=tx.objectStore('items'), r=s.get(lid);
          r.onsuccess=function(){ if(r.result) s.put(Object.assign({},r.result,{read:true})) };
          tx.oncomplete=function(){ db.close() }; tx.onerror=function(){ db.close() };
        }).catch(function(){});
      }
    }catch(e){}
  }
  try{
    noticeTap=function(id,url,ttl,bd){
      markLocalRead(id);
      refreshNotificationBadge();
      var raw=String(url||''), title='', body='';
      try{ title=ttl?decodeURIComponent(ttl):''; body=bd?decodeURIComponent(bd):'' }catch(e){}
      var m=raw.match(/[?&]o=([^&]+)/);
      if(m){ try{ openOfferById(decodeURIComponent(m[1])); return }catch(e){} }
      m=raw.match(/[?&]order=([^&]+)/);
      if(m){ try{ openOrderById(decodeURIComponent(m[1])); return }catch(e){} }
      if(/#offers/.test(raw)||/[?&]v=offers/.test(raw)||/كود|خصم/.test(title+body)){ try{ offV(); return }catch(e){} }
      if(/عرض/.test(title)&&S.r=='customer'){ try{ offV(); return }catch(e){} }
      notificationCenter();
    };
  }catch(e){}

  try{
    markNoticeRead=function(id){ markLocalRead(id); notificationCenter(); refreshNotificationBadge(); };
    markAllNoticesRead=function(){
      try{ call('inboxReadAll').then(function(){bustInbox()}).catch(function(){}) }catch(e){}
      try{
        listPushNotifications().then(function(list){
          return noticeDb().then(function(db){
            var tx=db.transaction('items','readwrite'), s=tx.objectStore('items');
            list.forEach(function(x){ s.put(Object.assign({},x,{read:true})) });
            tx.oncomplete=function(){ db.close() }; tx.onerror=function(){ db.close() };
          });
        }).catch(function(){});
      }catch(e){}
      notificationCenter(); refreshNotificationBadge();
    };
  }catch(e){}
})();
</script>

<script>
/* ============ استشارة سريعة + إرسال الأوردر واتساب + تحسين «اطلب تاني» ============ */
(function(){
  var WA='201154017470';
  function waOpen(text){
    var url='https://wa.me/'+WA+'?text='+encodeURIComponent(text);
    try{ window.open(url,'_blank','noopener') }catch(e){ try{ location.href=url }catch(e2){} }
  }
  function userName(){ try{ return (typeof S!=='undefined'&&S.n)?S.n:'' }catch(e){ return '' } }

  /* ---------- استشارة سريعة ---------- */
  function closeSheet(){ var m=document.getElementById('shQc'); if(m&&m.parentNode) m.parentNode.removeChild(m) }
  var CATS=[
    ['\u{1F912}','حرارة أو سخونية'],
    ['\u{1F927}','برد وزكام وكحة'],
    ['\u{1F915}','صداع'],
    ['\u{1F922}','مغص أو قولون أو إسهال'],
    ['\u{1F321}\uFE0F','حساسية أو حكة'],
    ['\u{1F9B7}','ألم أسنان'],
    ['\u{1FA79}','جرح أو مشكلة جلدية'],
    ['\u{1F48A}','متابعة ضغط أو سكر'],
    ['\u{1F9B4}','آلام عضلات ومفاصل'],
    ['\u{1F476}','طفل أو رضيع'],
    ['\u{1F50D}','استفسار عن دواء معيّن'],
    ['\u{1F4AC}','استفسار آخر']
  ];
  try{
    window.quickConsultV=function(){
      closeSheet();
      var nm=userName();
      var m=document.createElement('div'); m.className='m'; m.id='shQc';
      var html='<div><b style="font-size:17px">\u{1FA7A} استشارة سريعة</b>'
        +'<small>اختار اللي بيحصل معاك، وهيفتحلك واتساب برسالة جاهزة للصيدلي.</small>'
        +'<div class="qc-grid">';
      CATS.forEach(function(c,i){ html+='<button type="button" class="qc-btn" data-i="'+i+'"><span class="e">'+c[0]+'</span><span>'+c[1]+'</span></button>' });
      html+='</div><button type="button" class="g" id="shQcClose" style="margin-top:12px">إغلاق</button></div>';
      m.innerHTML=html;
      document.body.appendChild(m);
      m.addEventListener('click',function(ev){ if(ev.target===m) closeSheet() });
      var cl=document.getElementById('shQcClose'); if(cl) cl.addEventListener('click',closeSheet);
      var bs=m.querySelectorAll('.qc-btn');
      for(var i=0;i<bs.length;i++){ bs[i].addEventListener('click',function(){
        var c=CATS[Number(this.getAttribute('data-i'))]||CATS[CATS.length-1];
        closeSheet();
        var t='السلام عليكم صيدلية شهاب \u{1F33F}\n'
          +'عندي: '+c[1]
          +(nm?('\nالاسم: '+nm):'')
          +'\nمن امتى: '
          +'\nالتفاصيل: ';
        waOpen(t);
      }) }
    };
  }catch(e){}

  /* ---------- إرسال الأوردر على واتساب من السلة ---------- */
  window.sendCartWa=function(){
    try{
      if(!CART.length){ var er=document.getElementById('cartError'); if(er) er.textContent='السلة فاضية'; return }
      var nm=userName();
      var t='السلام عليكم صيدلية شهاب \u{1F33F}\nعايز أطلب:\n'
        +CART.map(function(x){ return '\u2022 '+(x.t||x.id)+' × '+(Number(x.qty)||1) }).join('\n');
      if(nm) t+='\n\nالاسم: '+nm;
      var mode=(typeof CART_MODE!=='undefined')?CART_MODE:'';
      if(mode) t+='\nالطريقة: '+(mode==='delivery'?'توصيل':'استلام من الصيدلية');
      var ad=document.getElementById('cartAddr'), addr=ad?ad.value.trim():'';
      if(addr) t+='\nالعنوان: '+addr;
      var sum=0,known=true;
      CART.forEach(function(x){
        var o=null; try{ o=(OF||[]).find(function(v){return String(v.id)===String(x.id)}) }catch(e){}
        o=o||x;
        var p=Number(String(o.p==null?'':o.p).replace(',','.'));
        if(o.p!=='' && o.p!=null && isFinite(p)) sum+=p*(Number(x.qty)||1); else known=false;
      });
      if(known&&sum>0) t+='\nالإجمالي المبدئي: '+sum.toFixed(2)+' جنيه';
      var cp=document.getElementById('couponCode');
      if(cp&&cp.value.trim()) t+='\nكود الخصم: '+cp.value.trim();
      waOpen(t);
    }catch(e){}
  };
  try{
    var cartPrev=cartV;
    cartV=function(){
      cartPrev.apply(this,arguments);
      try{
        if(document.getElementById('cartWaBtn')) return;
        var lines=document.getElementById('cartLines');
        if(!lines||!lines.parentNode) return;
        var b=document.createElement('button');
        b.id='cartWaBtn'; b.type='button'; b.className='g'; b.style.marginTop='10px';
        b.textContent='\u{1F4E4} ابعت الأوردر على واتساب';
        b.addEventListener('click',window.sendCartWa);
        lines.parentNode.insertBefore(b,lines.nextSibling);
      }catch(e){}
    };
  }catch(e){}

  /* ---------- تحسين زر «اطلب تاني» ---------- */
  try{
    injectRepeat=function(){
      try{
        if(V!='list'&&V!='mine')return;
        var done='تم التسليم للعميل';
        try{ if(typeof ST!=='undefined'&&ST.done&&ST.done[0]) done=ST.done[0] }catch(e){}
        var cards=document.querySelectorAll('#ls .card[data-oid]');
        for(var i=0;i<cards.length;i++){
          var c=cards[i];
          if(c.querySelector('.repeat-btn')) continue;
          var chip=c.querySelector('.chip');
          if(!chip||String(chip.textContent||'').trim()!=done) continue;
          var b=document.createElement('button');
          b.type='button'; b.className='g repeat-btn';
          b.textContent='\u{1F501} اطلب نفس الأوردر تاني';
          (function(bb,oid){ bb.addEventListener('click',function(ev){ ev.stopPropagation(); repeatOrder(oid,bb) }) })(b,c.getAttribute('data-oid'));
          c.appendChild(b);
        }
      }catch(e){}
    };
    if(typeof injectRepeat==='function') injectRepeat();
  }catch(e){}
})();
</script>

<script>
/* ============ نقاط الولاء + أكواد خصم متعدّدة (مرة واحدة / متعدد) + خصم ترحيبي ============ */
(function(){
  function G(id){ return document.getElementById(id) }
  function E(s){ try{ return (typeof esc==='function')?esc(s):String(s==null?'':s) }catch(e){ return String(s==null?'':s) } }
  function EM(x){ try{ return (typeof em==='function')?em(x):String(x&&x.message||x) }catch(e){ return String(x&&x.message||x) } }
  function TO(m,k){ try{ if(typeof toast==='function') toast(m,k) }catch(e){} }
  function CF(m){ try{ return confirm(m) }catch(e){ return true } }
  function copyText(t){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true }
    }catch(e){}
    try{
      var i=document.createElement('textarea'); i.value=t; i.style.position='fixed'; i.style.opacity='0';
      document.body.appendChild(i); i.focus(); i.select();
      var ok=document.execCommand('copy'); document.body.removeChild(i); return ok;
    }catch(e){ return false }
  }
  function role(){ try{ return (typeof S!=='undefined'&&S.r)?S.r:'' }catch(e){ return '' } }
  function isStaff(){ var r=role(); return r==='manager'||r==='pharmacist' || r==='admin' }

  /* ---------- تحويل وقت إلى قيمة datetime-local ---------- */
  function dtVal(n){ if(!n) return ''; var d=new Date(+n); if(isNaN(+d)) return ''; try{ return new Date(+n-d.getTimezoneOffset()*60000).toISOString().slice(0,16) }catch(e){ return '' } }

  /* ================== 1) كارت نقاط الولاء في «حسابي» ================== */
  function pointsCard(){
    var box=G('profile'); if(!box||G('ptCard')) return;
    var holder=document.createElement('div'); holder.className='pt-card'; holder.id='ptCard';
    holder.innerHTML='<b style="font-size:16px">⭐ نقاط الولاء</b><div class="rating-note">جاري تحميل النقاط…</div>';
    box.appendChild(holder);
    (async function(){
    var d=null; try{ d=await call('loyaltyGet') }catch(e){ try{holder.parentNode&&holder.parentNode.removeChild(holder)}catch(_){} return }
    if(!d||typeof d.points==='undefined'){ try{holder.parentNode&&holder.parentNode.removeChild(holder)}catch(_){} return }
    if(!holder.parentNode) return;
    var pts=Number(d.points)||0, step=Number(d.step||100)||100;
    var can=pts>=step;
    var html='<b style="font-size:16px">⭐ نقاط الولاء</b>'
      +'<div style="margin-top:4px">رصيدك: <span class="ly-badge">'+pts+' نقطة</span></div>';
    if(d.first&&d.welcomeOn) html+='<div class="rating-note">🎉 عندك خصم ترحيبي <b>'+d.welcomePct+'%</b> على أول أوردر — بيتطبق لوحده.</div>';
    if(can){
      html+='<div class="rating-note">تقدر تحوّل نقاطك لكود خصم تستعمله في السلة.</div>'
        +'<button class="g" id="ptRedeem" style="margin-top:6px">🎁 حوّل نقاطي لكود خصم</button>';
    } else {
      html+='<div class="rating-note">اجمع <b>'+Math.max(0,step-pts)+'</b> نقطة كمان وتحوّلهم لكود خصم.</div>';
    }
    holder.innerHTML=html;
    var b=G('ptRedeem');
    if(b) b.addEventListener('click',async function(){
      var bb=b; bb.disabled=true; bb.textContent='جاري التحويل…';
      try{
        var r=await call('pointsRedeem',{});
        try{ localStorage.setItem('shehab_pts_code',r.code) }catch(e){}
        var card=G('ptCard');
        if(card) card.innerHTML='<b style="font-size:16px">🎉 كود الخصم بتاعك جاهز</b>'
          +'<div style="margin:8px 0"><span class="cp-code">'+E(r.code)+'</span></div>'
          +'<div class="rating-note">خصم <b>'+r.percent+'%</b> — صالح 30 يوم، ويُستخدم مرة واحدة.</div>'
          +'<div class="rating-note">الرصيد المتبقي: <b>'+r.points+'</b> نقطة.</div>'
          +'<button class="g" id="ptCopy" style="margin-top:6px">📋 انسخ الكود</button>'
          +'<div class="rating-note">استعمله في شاشة السلة عند الطلب (هيتحط لوحده كمان).</div>';
        var c=G('ptCopy');
        if(c) c.addEventListener('click',function(){ var ok=copyText(r.code); TO(ok?'تم نسخ الكود ✔':'الكود: '+r.code, ok?'ok':'') });
      }catch(x){ bb.disabled=false; bb.textContent='🎁 حوّل نقاطي لكود خصم'; TO(EM(x),'bad') }
    });
    })();
  }

  /* ================== 2) شاشة حسابي: أزرار المدير + الكارت ================== */
  try{
    var profilePrev=profileV;
    profileV=async function(){
      await profilePrev.apply(this,arguments);
      try{
        var box=G('profile'); if(!box) return;
        if(isStaff()){
          var old=box.querySelectorAll('button');
          for(var i=0;i<old.length;i++){ var oc=old[i].getAttribute('onclick')||''; if(oc.indexOf('couponAdminV')>=0) old[i].style.display='none' }
          if(!G('cpAdminBtn')) box.insertAdjacentHTML('beforeend',
            '<button class="g" id="cpAdminBtn">🎟️ أكواد الخصم</button>'
            +'<button class="g" id="lySetBtn">⭐ إعدادات نقاط الولاء</button>');
          var cb=G('cpAdminBtn'); if(cb) cb.addEventListener('click',function(){ try{ couponAdminV() }catch(e){} });
          var lb=G('lySetBtn'); if(lb) lb.addEventListener('click',function(){ try{ loyaltySettingsV() }catch(e){} });
        } else {
          await pointsCard();
        }
      }catch(e){}
    };
  }catch(e){}

  /* ================== 3) السلة: كود النقاط + تنبيه الخصم الترحيبي ================== */
  try{
    var cartPrev=cartV;
    cartV=function(){
      cartPrev.apply(this,arguments);
      try{
        var inp=G('couponCode');
        if(inp&&!inp.value){
          var saved=null; try{ saved=localStorage.getItem('shehab_pts_code') }catch(e){}
          if(saved) inp.value=saved;
        }
        var lines=G('cartLines');
        if(lines&&lines.parentNode&&!G('welcomeNote')&&role()==='customer'){
          var note=document.createElement('div');
          note.id='welcomeNote'; note.className='profile-field'; note.style.display='none';
          lines.parentNode.insertBefore(note,lines);
          (async function(){
            try{
              var d=await call('loyaltyGet');
              if(d&&d.first&&d.welcomeOn){
                note.style.display='';
                note.innerHTML='🎉 خصم ترحيبي <b>'+d.welcomePct+'%</b> على أول أوردر — هيتطبق تلقائيًا وقت الإرسال.';
              }
            }catch(e){}
          })();
        }
      }catch(e){}
    };
  }catch(e){}

  /* ================== 4) إدارة أكواد الخصم (مدير) ================== */
  async function cpLoad(){
    var box=G('cpList'); if(!box) return;
    var l=null;
    try{ l=await call('couponList') }catch(e){ box.innerHTML='<div class="err">'+E(EM(e))+'</div>'; return }
    if(!l||!l.length){ box.innerHTML='<div class="card">مفيش أكواد خصم لحد الآن.</div>'; return }
    var now=Date.now();
    box.innerHTML=l.map(function(c){
      var state=!c.active?'⏸️ موقوف':((c.start&&now<c.start)?'⏳ لسه مش شغال':((c.end&&now>=c.end)?'⌛ منتهي':'✅ شغال'));
      var when=(c.start?('من '+new Date(c.start).toLocaleDateString('ar-EG')):'من غير تاريخ بداية')+' — '+(c.end?('لـ '+new Date(c.end).toLocaleDateString('ar-EG')):'من غير تاريخ نهاية');
      return '<div class="card" data-code="'+E(c.code)+'">'
        +'<div class="cp-code">'+E(c.code)+'</div>'
        +'<div>خصم <b>'+c.percent+'%</b> — '+(c.all?'كل الأصناف':'أصناف محددة')+'</div>'
        +'<div class="rating-note">📅 '+when+'</div>'
        +'<div class="rating-note">'+(c.once?'🔒 العميل يستعمله <b>مرة واحدة</b>':'🔁 العميل يستعمله <b>أكثر من مرة</b>')
          +(c.max>0?(' — أقصى '+c.max+' استخدام إجمالي'):'')
          +(c.first?' — لكود <b>أول أوردر</b> فقط':'')+'</div>'
        +'<div class="rating-note">الحالة: <b>'+state+'</b> — اتستخدم <b>'+c.used+'</b> مرة</div>'
        +'<div class="row"><button class="g" data-act="edit">✏️ تعديل</button>'
        +'<button class="g" data-act="toggle">'+(c.active?'⏸️ إيقاف':'▶️ تفعيل')+'</button>'
        +'<button class="g" data-act="del">🗑️ حذف</button></div></div>';
    }).join('');
    var cards=box.querySelectorAll('.card[data-code]');
    for(var i=0;i<cards.length;i++)(function(card){
      var code=card.getAttribute('data-code');
      var c=l.filter(function(x){return x.code===code})[0];
      card.querySelector('[data-act="edit"]').addEventListener('click',function(){ cpFormOpen(c) });
      card.querySelector('[data-act="toggle"]').addEventListener('click',async function(){
        try{ await call('couponSetActive',{code:code,on:!c.active}); TO(c.active?'تم إيقاف الكود':'تم تفعيل الكود','ok'); cpLoad() }catch(e){ TO(EM(e),'bad') }
      });
      card.querySelector('[data-act="del"]').addEventListener('click',async function(){
        if(!CF('تحذف الكود '+code+'؟')) return;
        try{ await call('couponDel',{code:code}); TO('تم حذف الكود','ok'); cpLoad() }catch(e){ TO(EM(e),'bad') }
      });
    })(cards[i]);
  }

  async function cpFormOpen(c){
    var wrap=G('cpFormWrap'), f=G('cpForm'); if(!wrap||!f) return;
    wrap.style.display='';
    var offers=[]; try{ offers=await callC('offers') }catch(e){}
    var all=c?!!c.all:true;
    var ids=(c&&c.ids)?String(c.ids).split(',').filter(Boolean):[];
    f.innerHTML=
      '<label>الكود</label><input id="cpCode" maxlength="30" value="'+E(c?c.code:'')+'" placeholder="مثال: SHEHAB10">'
      +'<label>نسبة الخصم %</label><input id="cpPercent" type="number" min="1" max="90" value="'+E(c?String(c.percent):'')+'">'
      +'<label>يبدأ من (اختياري)</label><input id="cpStart" type="datetime-local" value="'+E(c?dtVal(c.start):'')+'">'
      +'<label>ينتهي في (اختياري)</label><input id="cpEnd" type="datetime-local" value="'+E(c?dtVal(c.end):'')+'">'
      +'<label class="featured-toggle"><input id="cpAll" type="checkbox" '+(all?'checked':'')+'> كل الأصناف</label>'
      +'<div id="cpItems" style="'+(all?'display:none':'')+'"><b>اختار الأصناف المسموح بها</b>'
        +offers.map(function(o){ return '<label class="featured-toggle"><input class="cpOffer" type="checkbox" value="'+E(o.id)+'" '+(ids.indexOf(String(o.id))>=0?'checked':'')+'> '+E(o.t)+'</label>' }).join('')
      +'</div>'
      +'<label class="featured-toggle"><input id="cpOnce" type="checkbox" '+(c&&c.once?'checked':'')+'> العميل يستعمله <b>مرة واحدة</b> فقط (لو مش متحدد: عدة مرات)</label>'
      +'<label>أقصى عدد استخدامات إجمالي (0 = بلا حد)</label><input id="cpMax" type="number" min="0" value="'+E(c?String(c.max||0):'0')+'">'
      +'<label class="featured-toggle"><input id="cpFirst" type="checkbox" '+(c&&c.first?'checked':'')+'> لكود <b>أول أوردر</b> فقط (عميل جديد)</label>'
      +'<div class="err" id="cpErr"></div>'
      +'<div class="row"><button class="g" id="cpSave">💾 حفظ الكود</button><button class="g" id="cpCancel">إلغاء</button></div>';
    G('cpAll').addEventListener('change',function(){ G('cpItems').style.display=this.checked?'none':'' });
    G('cpCancel').addEventListener('click',function(){ wrap.style.display='none' });
    G('cpSave').addEventListener('click',async function(){
      var b=this;
      var body={
        code:G('cpCode').value.trim(),
        percent:Number(G('cpPercent').value),
        all:G('cpAll').checked,
        ids:[].slice.call(document.querySelectorAll('.cpOffer:checked')).map(function(x){return x.value}),
        start:G('cpStart').value,
        end:G('cpEnd').value,
        once:G('cpOnce').checked,
        max:Number(G('cpMax').value||0),
        first:G('cpFirst').checked
      };
      try{
        b.disabled=true; b.textContent='جاري الحفظ…';
        await call('couponSaveNew',body);
        G('cpErr').textContent=''; TO('تم حفظ الكود ✔','ok');
        wrap.style.display='none'; cpLoad();
      }catch(x){ G('cpErr').textContent=EM(x) }
      finally{ b.disabled=false; b.textContent='💾 حفظ الكود' }
    });
  }

  window.couponAdminV=async function(){
    try{ V='couponAdmin' }catch(e){}
    app('<div class="list-head"><h2>🎟️ أكواد الخصم</h2><button class="g refresh-button" id="cpReload" aria-label="تحديث"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-4L3 10"></path><path d="M3 4v6h6"></path><path d="M4 13a8 8 0 0 0 14.7 4L21 14"></path><path d="M21 20v-6h-6"></path></svg></button></div>'
      +'<div class="rating-note">اعمل أكواد كتير، وحدّد لكل كود: العميل يستعمله <b>مرة واحدة</b> ولا <b>عدة مرات</b>.</div>'
      +'<div id="cpList">جاري التحميل…</div>'
      +'<button class="g" id="cpNewBtn" style="margin-top:10px">➕ كود جديد</button>'
      +'<div id="cpFormWrap" style="display:none"><b>بيانات الكود</b><div id="cpForm"></div></div>');
    var nb=G('cpNewBtn'); if(nb) nb.addEventListener('click',function(){ cpFormOpen(null) });
    var rb=G('cpReload'); if(rb) rb.addEventListener('click',function(){ cpLoad() });
    cpLoad();
  };

  /* ================== 5) إعدادات نقاط الولاء (مدير) ================== */
  window.loyaltySettingsV=async function(){
    try{ V='loyaltySettings' }catch(e){}
    app('<h2>⭐ إعدادات نقاط الولاء</h2><div id="lyBox">جاري التحميل…</div>');
    var box=G('lyBox'), c=null;
    try{ c=await call('settingsGet') }catch(e){ box.innerHTML='<div class="err">'+E(EM(e))+'</div>'; return }
    box.innerHTML=
      '<label>نقاط لكل 10 جنيه من الأوردر</label><input id="lyPer10" type="number" min="0" value="'+E(String(c.per10))+'">'
      +'<label>نقاط ثابتة لكل أوردر مكتمل</label><input id="lyPerOrder" type="number" min="0" value="'+E(String(c.perOrder||0))+'">'
      +'<label>كل كام نقطة تعمل كود خصم؟</label><input id="lyStep" type="number" min="1" value="'+E(String(c.step))+'">'
      +'<label>نسبة كود الخصم %</label><input id="lyPctStep" type="number" min="1" max="90" value="'+E(String(c.pctStep))+'">'
      +'<label>أقصى نسبة خصم %</label><input id="lyMaxPct" type="number" min="1" max="90" value="'+E(String(c.maxPct))+'">'
      +'<label class="featured-toggle"><input id="lyWelcomeOn" type="checkbox" '+(c.welcomeOn?'checked':'')+'> تفعيل الخصم الترحيبي لأول أوردر</label>'
      +'<label>نسبة الخصم الترحيبي %</label><input id="lyWelcomePct" type="number" min="1" max="90" value="'+E(String(c.welcomePct))+'">'
      +'<div class="rating-note">مثال: نقطة لكل 10 جنيه + كل 100 نقطة تعمل كود خصم 5% بحد أقصى 25%.</div>'
      +'<div class="err" id="lyErr"></div><button class="g" id="lySave" style="margin-top:8px">💾 حفظ الإعدادات</button>';
    G('lySave').addEventListener('click',async function(){
      var b=this;
      try{
        b.disabled=true; b.textContent='جاري الحفظ…';
        await call('settingsSave',{
          per10:Number(G('lyPer10').value), perOrder:Number(G('lyPerOrder').value),
          step:Number(G('lyStep').value), pctStep:Number(G('lyPctStep').value), maxPct:Number(G('lyMaxPct').value),
          welcomeOn:G('lyWelcomeOn').checked, welcomePct:Number(G('lyWelcomePct').value)
        });
        G('lyErr').textContent=''; TO('تم حفظ الإعدادات ✔','ok');
      }catch(x){ G('lyErr').textContent=EM(x) }
      finally{ b.disabled=false; b.textContent='💾 حفظ الإعدادات' }
    });
  };
})();
</script>

<style>
.ma-card{background:linear-gradient(135deg,#fff,#f7f9fc);border:1px solid #e6ebf5;border-radius:16px;padding:12px;margin-top:10px}
html.dark .ma-card{background:linear-gradient(135deg,#151b2a,#1c2233);border-color:#2b3555}
.ma-row{display:flex;gap:10px;flex-wrap:wrap}
.ma-row .card{flex:1 1 260px}
.ma-time{display:flex;gap:8px;align-items:center;margin-top:6px}
.ma-time input[type=time]{min-width:120px}
.ma-chip{display:inline-block;background:#eef2fb;color:#1a237e;border-radius:999px;padding:2px 10px;margin:4px 6px 0 0;font-size:13px}
html.dark .ma-chip{background:#1c2744;color:#dbe7ff;border-color:#2c3b5f}
</style>
<script>
(function(){
  function G(id){ return document.getElementById(id); }
  function E(s){ try{ return (typeof esc==='function')?esc(s==null?'':s):String(s==null?'':s); }catch(e){ return String(s==null?'':s); } }
  function EM(x){ try{ return (typeof em==='function')?em(x):String(x&&x.message||x); }catch(e){ return String(x&&x.message||x); } }
  function TO(m,k){ try{ if(typeof toast==='function') toast(m,k); }catch(e){} }
  function role(){ try{ return (typeof S!=='undefined'&&S.r)?S.r:'' }catch(e){ return ''; } }
  function isStaff(){ var r=role(); return r==='manager'||r==='pharmacist'||r==='admin'; }
  function and(){ try{ return window.ShehabAndroid || window.androidBridge || null; }catch(e){ return null; } }
  function medSupp(){ var a=and(); return a && typeof a.medSupported==='function' && a.medSupported(); }
  function syncToAndroid(list){ var a=and(); if(!a||typeof a.medSetAll!=='function') return; try{ a.medSetAll(JSON.stringify(list)); }catch(e){} }
  function loadList(){ try{ var v=localStorage.getItem('shehab_med'); return v?JSON.parse(v):[]; }catch(e){ return []; } }
  function saveList(l){ try{ localStorage.setItem('shehab_med',JSON.stringify(l)); syncToAndroid(l); }catch(e){} }
  try{
    var p2=profileV;
    profileV=async function(){
      await p2.apply(this,arguments);
      try{
        var box=G('profile'); if(!box) return;
        if(isStaff()){
          if(!G('ordSound')){ box.insertAdjacentHTML('beforeend','<div class="card" id="ordSound"><b>🔔 صوت تنبيه الأوردر للصيدلي</b><div class="rating-note">لو فيه أوردر جديد بيصير صوت عالي + اهتزاز حتى تعرفه.</div><button class="g" id="ordToggle">جاري التحميل…</button><button class="g" id="ordTest">🔈 تجربة الصوت</button></div>'); }
          var t=G('ordToggle'), tt=G('ordTest'), a=and();
          if(t){ (function(){ var on=true; if(a&&typeof a.orderAlertOn==='function'){ try{ on=a.orderAlertOn(); }catch(e){} } function upd(){ t.textContent=on?'🔕 أوقف صوت الأوردر':'🔔 فعل صوت الأوردر'; } upd(); t.addEventListener('click',function(){ on=!on; if(a&&typeof a.setOrderAlert==='function'){ try{ a.setOrderAlert(on); }catch(e){} } upd(); TO(on?'تم تفعيل صوت تنبيه الأوردر ✔':'تم إيقاف صوت تنبيه الأوردر ✔','ok'); }); })(); }
          if(tt&&a&&typeof a.testOrderAlert==='function'){ tt.addEventListener('click',function(){ try{ a.testOrderAlert(); TO('تم تشغيل تجربة الصوت','ok'); }catch(e){ TO(EM(e),'bad'); } }); }
        }
      }catch(e){}
    };
  }catch(e){}
  window.medV=function(){
    try{ if(typeof V!=='undefined') V='medAlarm'; }catch(e){}
    var supp=medSupp();
    var html='<h2>⏰ منبّه الدواء</h2><div class="rating-note">'+(supp?'المعالج يعمل في تطبيق الأندرويد. تنبيهات المواعيد هتظهر حتى لو التطبيق مقفول.':'منبّه الدواء شغّال في <b>تطبيق الأندرويد</b> فقط.')+'</div><div class="ma-card"><b id="maFormTitle">➕ إضافة ملاحظة/دواء</b><label>اسم الدواء / إسم الملاحظة</label><input id="maName" placeholder="مثال: أمبيسيلين"><label>الجرعة / تفاصيل</label><input id="maDose" placeholder="مثال: بعد الأكل"><label>المواعيد (كل يوم)</label><div id="maTimes"></div><button class="g" id="maAddTime">+ إضافة ميعاد</button><label>يكرر</label><div class="row"><label class="featured-toggle"><input type="radio" name="maDays" value="0" checked> مستمر (كل يوم)</label><label class="featured-toggle"><input type="radio" name="maDays" value="3"> ٣ أيام</label><label class="featured-toggle"><input type="radio" name="maDays" value="5"> ٥ أيام</label><label class="featured-toggle"><input type="radio" name="maDays" value="7"> ٧ أيام</label></div><button class="g" id="maSave" style="margin-top:8px">💾 حفظ الميقات</button></div><div class="ma-card"><b>📋 المواعيد المحفوظة</b><div id="maList">مفيش حاجة لحد الآن.</div></div>'+(supp?'<div class="ma-card"><b>🔈 تجربة</b><button class="g" id="maTest">تشغيل تنبيه تجربة</button></div>':'');
    if(typeof app==='function') app(html);
    function addTime(v){ var div=document.createElement('div'); div.className='ma-time'; div.innerHTML='<input type="time" value="'+E(v||'08:00')+'"><button class="g" data-del="t">حذف</button>'; div.querySelector('[data-del="t"]').addEventListener('click',function(){ div.remove(); }); var mt=G('maTimes'); if(mt) mt.appendChild(div); }
    addTime('08:00'); addTime('20:00');
    var mta=G('maAddTime'); if(mta) mta.addEventListener('click',function(){ addTime(''); });
    var editingId=null;
    function medFillTimes(arr){ try{ var mt=G('maTimes'); if(mt)mt.innerHTML=''; var list=(arr&&arr.length)?arr:['08:00','20:00']; for(var i=0;i<list.length;i++)addTime(list[i]); }catch(e){} }
    function medSetDays(d){ try{ var rd=document.querySelectorAll('input[name="maDays"]'); for(var i=0;i<rd.length;i++){ rd[i].checked=(parseInt(rd[i].value||0,10)===(d||0)); } }catch(e){} }
    function medFormReset(){ try{ editingId=null; var t=G('maFormTitle'); if(t)t.textContent='➕ إضافة ملاحظة/دواء'; var nm=G('maName'); if(nm)nm.value=''; var ds=G('maDose'); if(ds)ds.value=''; medFillTimes(null); medSetDays(0); var sv=G('maSave'); if(sv)sv.textContent='💾 حفظ الميقات'; }catch(e){} }
    function medEditReset(rm){ try{ if(rm&&editingId&&rm.id===editingId)medFormReset(); }catch(e){} }
    function medStartEdit(di){ try{ var l=loadList(); var x=l[di]; if(!x)return; editingId=x.id||('m'+di); var nm=G('maName'); if(nm)nm.value=x.name||''; var ds=G('maDose'); if(ds)ds.value=x.dose||''; medFillTimes(x.times); medSetDays(x.days||0); var t=G('maFormTitle'); if(t)t.textContent='✏️ تعديل المنبّه'; var sv=G('maSave'); if(sv)sv.textContent='💾 حفظ التعديل'; try{ if(nm&&nm.scrollIntoView)nm.scrollIntoView({block:'center'}); }catch(e){} }catch(e){} }
    function renderList(){ var l=loadList(); var box=G('maList'); if(!l.length){ if(box) box.innerHTML='<div class="card">مفيش أي منبه محفوظ.</div>'; return; } var h=''; for(var i=0;i<l.length;i++){ var x=l[i]; var days=x.days||0; var dtext=days?('يكرر '+days+' يوم'):('مستمر — كل يوم'); var times=''; var tt=x.times||[]; for(var j=0;j<tt.length;j++){ times+='<span class="ma-chip">'+E(tt[j])+'</span>'; } h+='<div class="card"><b>'+E(x.name)+'</b><div class="rating-note">'+E(x.dose||'')+'</div><div>'+times+'</div><div class="rating-note">'+dtext+'</div><div class="row"><button class="g" data-edit="'+i+'">✏️ تعديل</button><button class="g" data-del="'+i+'" style="color:#c62828">🗑️ حذف</button></div></div>'; } if(box) box.innerHTML=h; var eds=box.querySelectorAll('[data-edit]'); for(var i=0;i<eds.length;i++){ (function(di){ eds[di].addEventListener('click',function(){ medStartEdit(di); }); })(i); } var dels=box.querySelectorAll('[data-del]'); for(var i=0;i<dels.length;i++){ (function(di){ dels[di].addEventListener('click',function(){ var L=loadList(); var rm=L[di]; L.splice(di,1); saveList(L); medEditReset(rm); renderList(); }); })(i); } }
    renderList();
    var msv=G('maSave'); if(msv) msv.addEventListener('click',function(){ var name=G('maName').value.trim(), dose=G('maDose').value.trim(); if(!name){ TO('اكتب اسم الدواء','bad'); return; } var times=[]; var inps=G('maTimes').querySelectorAll('input[type=time]'); for(var i=0;i<inps.length;i++){ var v=inps[i].value; if(v) times.push(v); } if(!times.length){ TO('اضف ميعاد واحد على الأقل','bad'); return; } var days=0; var rd=document.querySelectorAll('input[name="maDays"]'); for(var i=0;i<rd.length;i++){ if(rd[i].checked){ days=parseInt(rd[i].value||0,10); break; } } var l=loadList(); if(editingId){ var found=false; for(var k=0;k<l.length;k++){ if(l[k]&&l[k].id===editingId){ l[k].name=name; l[k].dose=dose; l[k].times=times; l[k].days=days; found=true; break; } } if(!found)l.push({id:editingId,name:name,dose:dose,times:times,on:true,days:days,startAt:Date.now()}); saveList(l); medFormReset(); TO('تم تحديث المنبّه ✔','ok'); } else { l.push({id:'m'+Date.now(),name:name,dose:dose,times:times,on:true,days:days,startAt:Date.now()}); saveList(l); TO('تم حفظ المنبّه ✔','ok'); G('maName').value=''; G('maDose').value=''; } renderList(); });
    var mtest=G('maTest'); if(mtest&&supp){ mtest.addEventListener('click',function(){ var a=and(); if(a&&typeof a.medTest==='function'){ try{ a.medTest(); TO('تم تشغيل اختبار المنبّه','ok'); }catch(e){ TO(EM(e),'bad'); } } else TO('الأندرويد مش جاهز','bad'); }); }
  };

<script>
(function(){

  /* ---------- 1) app share -> APK download link ---------- */
  window.shareApp=async function(){
    var _txt='حمّل تطبيق صيدليات شهاب من هنا:';
    if(typeof window.openShareSheet==='function'){ try{ window.openShareSheet({url:APK_DL,text:_txt,title:'صيدليات شهاب'}); return }catch(e){} }
    try{ if(navigator.share){ await navigator.share({title:'صيدليات شهاب',text:_txt,url:APK_DL}); return } }catch(e){ if(e&&e.name==='AbortError')return }
    try{ await navigator.clipboard.writeText(APK_DL); TO('تم نسخ رابط تحميل التطبيق ✔','ok') }
    catch(e){ try{prompt('انسخ رابط تحميل التطبيق:',APK_DL)}catch(e2){} }
  };

  /* ---------- 2) address -> external Google Maps app ---------- */
  window.shehabAddress=function(){
    var isAnd=false; try{ isAnd=(typeof isAndroid==='function')?isAndroid():/android/i.test(navigator.userAgent) }catch(e){}

  };

  /* ---------- 3) quick consult: swipe down, no close button ---------- */
  (function(){
    var prev=window.quickConsultV;

      prev.apply(this,arguments);

        var m=G('shQc'); if(!m)return;

          var h=document.createElement('div');h.className='swipe-handle';h.title='اسحب لأسفل للإغلاق';

  /* ---------- shared cart quantity helpers ---------- */

  function cartArr(){try{return (typeof CART!=='undefined'?CART:[])}catch(e){return[]}}
  function findCart(id){try{return cartArr().find(function(v){return String(v.id)===String(id)})}catch(e){return null}}
  function cartUpsert(id,meta,qty){
    id=String(id);qty=Math.max(0,Math.min(9999,Math.floor(Number(qty)||0)));
    try{
      var arr=cartArr();
      var x=arr.find(function(v){return String(v.id)===id});
      if(qty===0){ CART=arr.filter(function(v){return String(v.id)!==id}); }
      else if(x){ x.qty=qty; if(meta){ if(!x.t)x.t=meta.t||''; if(x.p===undefined||x.p==='')x.p=meta.p||''; if(!x.ic)x.ic=meta.ic||''; } }
      else { arr.push({id:id,qty:qty,t:(meta&&meta.t)||'',p:(meta&&meta.p)||'',ic:(meta&&meta.ic)||''}); }
    }catch(e){}
    cartPersistSafe();cartBadgeSafe();
  }
  function qtyRow(id,meta){

      input.addEventListener('change',function(){var v=Math.floor(Number(input.value)||0);cartUpsert(id,meta,v);render()});
      var plus=document.createElement('button');plus.type='button';plus.className='g';plus.textContent='+';
      plus.addEventListener('click',function(e){e.stopPropagation();cartUpsert(id,meta,q+1);render()});
      w.appendChild(minus);w.appendChild(input);w.appendChild(plus);
    }
    render();
    return w;
  }

  /* ---------- 4.5) item kebab menu + move-to-section ---------- */

    list.addEventListener('click',function(ev){ev.stopPropagation()});
    wrap.appendChild(b);wrap.appendChild(list);
    return wrap;
  }
  function pickSection(title,cb){
    (async function(){
      var list=[];

  }

  var pvPrev=(typeof profileV==='function')?profileV:null;

  /* ---------- 8) sections admin ---------- */
  window.secAdminV=async function(){
    run('<h2>🗂️ الأقسام</h2><small>أضف أقسام تظهر أسفل شاشة العروض، وضيف داخل كل قسم أصناف.</small><button id="secNewBtn" type="button">＋ قسم جديد</button><div id="secAdminList">جاري التحميل…</div><button class="g" onclick="offV()">⬅️ رجوع للعروض</button>');
    var nb=G('secNewBtn'); if(nb)nb.addEventListener('click',function(){secEditor()});
    var box=G('secAdminList');

    renderSecAdmin(list);

  function renderSecAdmin(list){
    var box=G('secAdminList'); if(!box)return;
    if(!Array.isArray(list)||!list.length){box.innerHTML='<div class="card">مفيش أقسام لسه. اضغط «قسم جديد».</div>';return}

      var c=document.createElement('div');c.className='card';
      c.innerHTML='<b style="font-size:16px">'+E(sec.name||'')+(sec.active?'':' <span class="rating-note">(مخفي)</span>')+'</b><div class="rating-note">'+((sec.items&&sec.items.length)?sec.items.length+' صنف':'مفيش أصناف')+'</div>';
      var r1=document.createElement('div');r1.className='row';
      r1.innerHTML='<button class="g" type="button" data-act="edit">✏️ تعديل</button><button class="g" type="button" data-act="toggle">'+(sec.active?'🙈 إخفاء':'👁️ إظهار')+'</button><button class="g" type="button" data-act="del">🗑️ حذف</button>';
      c.appendChild(r1);
      var add=document.createElement('button');add.className='g';add.type='button';add.textContent='＋ إضافة صنف';add.addEventListener('click',function(){secItemEditor(sec.id)});

        rr.innerHTML='<button class="g" type="button" data-iedit="'+E(it.id)+'">✏️ تعديل</button><button class="g" type="button" data-imove="'+E(it.id)+'">📥 نقل</button><button class="g" type="button" data-idel="'+E(it.id)+'">🗑️ حذف</button>';
        ic.appendChild(rr);c.appendChild(ic);

      c.addEventListener('click',async function(ev){

          if(ie)return secItemEditor(sec.id,ie);

  async function refreshSecAdmin(){try{var l=await call('sectionsAdmin');renderSecAdmin(l)}catch(e){TO(EM(e),'bad')}}
  function readImg(input,cb){
    var f=input.files&&input.files[0]; if(!f)return;
    function raw(){var r=new FileReader();r.onload=function(){cb(String(r.result||''))};r.readAsDataURL(f)}
    if(typeof icn==='function'){ try{ icn(f).then(function(d){ if(d)cb(d); else raw() }).catch(raw); return }catch(e){} }
    raw();
  }
  function secEditor(id){
    (async function(){
      var sec=null;
      if(id){try{var l=await call('sectionsAdmin');sec=(l||[]).find(function(s){return String(s.id)===String(id)})||null}catch(e){}}
      var m=document.createElement('div');m.className='m';

      document.body.appendChild(m);
      m.addEventListener('click',function(ev){if(ev.target===m)m.remove()});

      G('secCancel').addEventListener('click',function(){m.remove()});
      G('secSaveBtn').addEventListener('click',async function(){
        var btn=this; if(btn.disabled)return;
        var name=G('secName').value.trim(); if(!name){G('secErr').textContent='اكتب اسم القسم';return}
        btn.disabled=true;var lbl=btn.textContent;btn.textContent='⏳ جاري الحفظ…';
        try{ await call('secSave',{id:id||'',name:name,img:img,sort:Number(G('secSort').value)||0}); m.remove(); TO('تم الحفظ ✔','ok'); refreshSecAdmin() }
        catch(e){var er=G('secErr');if(er)er.textContent=EM(e)}
        finally{ if(document.body.contains(btn)){btn.disabled=false;btn.textContent=lbl} }
      });

  }
  function secItemEditor(secId,id){
    (async function(){
      var it=null;
      if(id){try{var l=await call('sectionsAdmin');(l||[]).forEach(function(s){if(String(s.id)===String(secId))(s.items||[]).forEach(function(x){if(String(x.id)===String(id))it=x})})}catch(e){}}
      var m=document.createElement('div');m.className='m';
      m.innerHTML='<div><b>'+(id?'تعديل صنف':'صنف جديد')+'</b><label>اسم الصنف</label><input id="siT" maxlength="120" value="'+E(it&&it.t||'')+'"><label>تفاصيل (اختياري)</label><textarea id="siX" rows="3">'+E(it&&it.x||'')+'</textarea><label>السعر (جنيه)</label><input id="siP" type="number" min="0" step="0.01" value="'+E(it&&it.p||'')+'"><label>السعر قبل الخصم (اختياري)</label><input id="siW" type="number" min="0" step="0.01" value="'+E(it&&it.w||'')+'"><label>صورة (اختياري)</label><input id="siImg" type="file" accept="image/*"><div id="siImgPrev">'+(it&&it.ic?('<img class="ic" src="'+E(it.ic)+'">'):'')+'</div><label>الترتيب</label><input id="siSort" type="number" value="'+(it?(it.sort||0):0)+'"><div class="err" id="siErr"></div><button class="g" type="button" id="siSave">💾 حفظ</button><button class="g" type="button" id="siCancel">إلغاء</button></div>';
      document.body.appendChild(m);
      m.addEventListener('click',function(ev){if(ev.target===m)m.remove()});
      var img=it&&it.ic?it.ic:'';
      G('siImg').addEventListener('change',function(){readImg(this,function(d){img=d;G('siImgPrev').innerHTML='<img class="ic" src="'+E(img)+'">'})});
      G('siCancel').addEventListener('click',function(){m.remove()});
      G('siSave').addEventListener('click',async function(){
        var btn=this; if(btn.disabled)return;
        var t=G('siT').value.trim(); if(!t){G('siErr').textContent='اكتب اسم الصنف';return}
        btn.disabled=true;var lbl=btn.textContent;btn.textContent='⏳ جاري الحفظ…';
        try{ await call('secItemSave',{sec:secId,id:id||'',title:t,x:G('siX').value.trim(),p:G('siP').value,w:G('siW').value,ic:img,sort:Number(G('siSort').value)||0}); m.remove(); TO('تم الحفظ ✔','ok'); refreshSecAdmin() }
        catch(e){var er=G('siErr');if(er)er.textContent=EM(e)}
        finally{ if(document.body.contains(btn)){btn.disabled=false;btn.textContent=lbl} }
      });
    })();
  }

  /* ---------- 9) offers screen: layout toggle (رأسي / عرضين جنب بعض) ---------- */
  var offVPrev=(typeof offV==='function')?offV:null;
  if(offVPrev){
    offV=async function(){ var r=await offVPrev.apply(this,arguments); try{
      var ap=G('app');
      if(ap){ var h=ap.querySelector('h2'); if(h&&!G('offLayout'))h.insertAdjacentElement('afterend',offLayoutBar()); }
      applyOffLayout();
    }catch(e){} return r; };
  }

  /* ---------- 10) شاشة المفضلة: أضف أصناف الأقسام المفضّلة ---------- */
  var favPrev=(typeof favoritesV==='function')?favoritesV:null;
  if(favPrev){
    favoritesV=async function(){
      var r=await favPrev.apply(this,arguments);
      try{
        var box=G('favList'); if(!box||V!=='favorites')return r;
        if(!SEC_CACHE.length){ try{ var l=await callC('sections'); SEC_CACHE=Array.isArray(l)?l:[]; SEC_READY=true }catch(e){} }
        await ensureFavs();
        var found=[];
        (SEC_CACHE||[]).forEach(function(s){(s.items||[]).forEach(function(it){ if(FAVS.map(String).indexOf(String(it.id))>-1) found.push({it:it,sec:s}) })});
        if(!found.length)return r;
        var head=document.createElement('h3');head.style.margin='14px 0 6px';head.textContent='🗂️ أصناف الأقسام';
        var row=document.createElement('div');row.className='sec-screen-items sec-grid';
        found.forEach(function(f){ row.appendChild(secItemCard(f.it,f.sec.id)) });
        box.appendChild(head); box.appendChild(row);
      }catch(e){}
      return r;
    };
  }
})();
</script>
<script>
/* ===== زرار السلة العائم — ثابت على كل الشاشات (من غير أي تقل على البرنامج) ===== */
(function(){
  try{
    var WRAP=null,FAB=null,READY=false;
    function build(){
      if(WRAP)return;
      WRAP=document.createElement('div');WRAP.id='cartFabWrap';
      FAB=document.createElement('button');FAB.id='cartFab';FAB.type='button';
      FAB.setAttribute('aria-label','سلة العروض');FAB.title='سلة العروض';
      FAB.addEventListener('click',function(){try{if(typeof cartV==='function')cartV()}catch(e){}});
      WRAP.appendChild(FAB);document.body.appendChild(WRAP);
    }
    function cartCount(){
      try{var c=(typeof CART!=='undefined'&&CART)?CART:[];var n=0;for(var i=0;i<c.length;i++)n+=(Number(c[i].qty)||0);return n}catch(e){return 0}
    }
    function sync(){
      if(!WRAP){if(!READY)return;build()}
      var logged=false;try{logged=!!(typeof S!=='undefined'&&S&&S.t)}catch(e){}
      var v='';try{v=(typeof V!=='undefined'&&V)||''}catch(e){}
      var dup=!!document.getElementById('cartHome');
      /* يظهر لكل مستخدم مسجّل دخول، على أي شاشة ما عدا السلة، وما يظهرش مكرر فوق الشاشة الرئيسية */
      var show=logged&&v!=='cart'&&!dup;
      WRAP.hidden=!show;
      if(!show)return;
      var n=cartCount();
      FAB.innerHTML='🛒'+(n>0?'<span class="cart-count">'+(n>99?'99+':n)+'</span>':'');
      FAB.setAttribute('aria-label','سلة العروض'+(n?' ('+n+' صنف)':''));
      /* لو فيه شريط «أضف للسلة» في صفحة العرض، نرفع الزرار شوية فوقه */
      try{WRAP.style.bottom=document.querySelector('.offer-actionbar')?'calc(env(safe-area-inset-bottom) + 128px)':''}catch(e){}
    }
    window.shehabCartFabSync=sync;
    function ready(){READY=true;build();sync()}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();
    /* أي إضافة/حذف في السلة بيحدّث الزرار مع تحديث شارة الرئيسية */
    try{if(typeof cartBadge==='function'){var cb=cartBadge;cartBadge=function(){var r=cb.apply(this,arguments);try{sync()}catch(e){}return r}}}catch(e){}
    /* أي تغيير شاشة بيغيّر محتوى #app — نراقبه ونحدّث الزرار (خفيف جدًا) */
    try{
      var ap=document.getElementById('app');
      if(ap&&window.MutationObserver){new MutationObserver(function(){try{sync()}catch(e){}}).observe(ap,{childList:true,subtree:false})}
    }catch(e){}
    /* ونغطّي كذلك أي نداء لـ navSync */
    try{if(typeof navSync==='function'){var ns=navSync;navSync=function(){var r=ns.apply(this,arguments);try{sync()}catch(e){}return r}}}catch(e){}
  }catch(e){}
})();
</script>
<script>
/* ===== «بياناتي» + «إعدادات الإشعارات» — تجميع زراير شاشة حسابي ===== */
(function(){
  'use strict';
  function G(id){ return document.getElementById(id); }
  function run(h){ try{ if(typeof app==='function')app(h); }catch(e){} }
  function role(){ try{ return (typeof S!=='undefined'&&S.r)?S.r:'' }catch(e){ return '' } }
  function isStaff(){ var r=role(); return r==='manager'||r==='pharmacist'||r==='admin'; }

  var MYDATA_WRAP=null, NOTIF_WRAP=null;

  /* ---------- (1) تجميع بيانات الحساب في زرار «بياناتي» ---------- */
  function buildMyData(){
    var p=G('profile'); if(!p||G('myDataBtn'))return;
    var save=p.querySelector('button[onclick*="saveProfile"]'); if(!save)return;
    var kids=Array.prototype.slice.call(p.children);
    var start=-1,end=kids.indexOf(save);
    for(var i=0;i<kids.length;i++){ var el=kids[i]; if(el.classList&&el.classList.contains('profile-field')&&/الاسم/.test(el.textContent||'')){start=i;break} }
    if(start<0)start=0;
    if(end<start)return;
    var anchor=kids[end+1]||null;
    var wrap=document.createElement('div');wrap.id='myDataWrap';wrap.hidden=true;
    for(var i=start;i<=end;i++)wrap.appendChild(kids[i]);
    MYDATA_WRAP=wrap;
    var btn=document.createElement('button');btn.type='button';btn.className='g';btn.id='myDataBtn';btn.textContent='👤 بياناتي';
    btn.addEventListener('click',function(){myDataV()});
    if(anchor&&anchor.parentNode===p)p.insertBefore(btn,anchor);else p.appendChild(btn);
    p.appendChild(wrap);
  }
  function myDataV(){
    var w=G('myDataWrap')||MYDATA_WRAP;
    if(!w){ try{profileV()}catch(e){}; return; }
    V='mydata';
    run('<h2>👤 بياناتي</h2><div id="myDataBox"></div><button class="g" type="button" id="myDataBack">⬅️ رجوع لحسابي</button>');
    var box=G('myDataBox'); if(box){ w.hidden=false; box.appendChild(w); }
    var bk=G('myDataBack'); if(bk)bk.addEventListener('click',function(){profileV()});
  }

  /* ---------- (2) تجميع إعدادات الإشعارات في زرار واحد ---------- */
  function buildNotifSettings(){
    var p=G('profile'); if(!p||G('notifSettingsBtn'))return;
    function byText(txt){var a=p.querySelectorAll('button');for(var i=0;i<a.length;i++){if(String(a[i].textContent||'').indexOf(txt)>-1)return a[i]}return null}
    var nodes=[];
    var nOrders=G('notifOrdersBtn'); if(nOrders)nodes.push(nOrders);
    var recs=null,bc=null,pfs=p.querySelectorAll('.profile-field');
    for(var i=0;i<pfs.length;i++){ var t=String(pfs[i].textContent||''); if(!recs&&t.indexOf('مستلمو إشعارات الطلبات')>-1)recs=pfs[i]; if(!bc&&t.indexOf('إشعارات العروض')>-1)bc=pfs[i]; }
    if(recs)nodes.push(recs);
    if(bc)nodes.push(bc);
    var snd=G('ordSound'); if(snd)nodes.push(snd);
    var diag=G('pushDiagBtn'); if(diag)nodes.push(diag);
    var sys=byText('إعدادات إشعارات النظام'); if(sys)nodes.push(sys);
    if(!nodes.length)return;
    var wrap=document.createElement('div');wrap.id='notifSettingsWrap';wrap.hidden=true;
    nodes.forEach(function(n){ if(n&&n.parentNode)wrap.appendChild(n) });
    NOTIF_WRAP=wrap;
    var btn=document.createElement('button');btn.type='button';btn.className='g';btn.id='notifSettingsBtn';btn.textContent='🔔 إعدادات الإشعارات';
    btn.addEventListener('click',function(){notifSettingsV()});
    var ref=G('myDataBtn');
    if(ref&&ref.parentNode===p)p.insertBefore(btn,ref.nextSibling);else p.appendChild(btn);
    p.appendChild(wrap);
  }
  function notifSettingsV(){
    var w=G('notifSettingsWrap')||NOTIF_WRAP;
    if(!w){ try{profileV()}catch(e){}; return; }
    V='notifSettings';
    run('<h2>🔔 إعدادات الإشعارات</h2><div id="notifSettingsBox"></div><button class="g" type="button" id="notifBack">⬅️ رجوع لحسابي</button>');
    var box=G('notifSettingsBox'); if(box){ w.hidden=false; box.appendChild(w); }
    var bk=G('notifBack'); if(bk)bk.addEventListener('click',function(){profileV()});
  }

  window.myDataV=myDataV;
  window.notifSettingsV=notifSettingsV;

  var base=(typeof profileV==='function')?profileV:null;
  if(base){
    profileV=async function(){
      var r=await base.apply(this,arguments);
      try{ buildMyData(); }catch(e){}
      try{ buildNotifSettings(); }catch(e){}
      return r;
    };
  }
})();
</script>
