<script>
/* ===== المرحلة 1: زووم الصور + lazy-load + اهتزاز + سكيلتون + بحث + شكل الكروت + نقاط السلايدر ===== */
(function(){
  'use strict';
  function G(id){return document.getElementById(id)}

  /* ---------- (2) زووم الصورة (lightbox) ---------- */
  function ensureZoom(){
    var z=G('imgZoom'); if(z)return z;
    z=document.createElement('div'); z.id='imgZoom'; z.hidden=true;
    z.innerHTML='<button type="button" id="imgZoomClose" aria-label="إغلاق">✕</button><img id="imgZoomPic" alt="">';
    document.body.appendChild(z);
    z.addEventListener('click',function(){ z.hidden=true; var p=G('imgZoomPic'); if(p)p.removeAttribute('src'); });
    return z;
  }
  function zoomImg(src,alt){ if(!src)return; var z=ensureZoom(); G('imgZoomPic').src=src; G('imgZoomPic').alt=alt||''; z.hidden=false; }
  window.zoomImg=zoomImg;
  document.addEventListener('click',function(e){
    var t=e.target;
    if(!t||t.tagName!=='IMG')return;
    if(t.id==='imgZoomPic')return;
    if(t.closest&&t.closest('.hero-card'))return; /* كارت السلايدر بيفتح العرض زي ما هو */
    var zoom=false;
    if(t.classList&&t.classList.contains('zoomable'))zoom=true;
    else if(t.closest&&(t.closest('.offer-detail')||t.closest('.sec-screen-head')))zoom=true;
    else if(t.closest&&t.classList&&t.classList.contains('ic')&&(t.closest('.offer-card')||t.closest('.sec-item')))zoom=true;
    if(!zoom)return;
    e.preventDefault(); e.stopPropagation();
    zoomImg(t.getAttribute('src'),t.getAttribute('alt'));
  },true);

  /* ---------- (29) تحميل الصور بالتدريج ---------- */
  function lazyify(root){
    try{
      var imgs=(root===document)?Array.prototype.slice.call(document.images):(root.querySelectorAll?Array.prototype.slice.call(root.querySelectorAll('img')):[]);
      for(var i=0;i<imgs.length;i++){
        var im=imgs[i];
        if(im.id==='imgZoomPic')continue;
        if(!im.getAttribute('loading'))im.setAttribute('loading','lazy');
        if(!im.getAttribute('decoding'))im.setAttribute('decoding','async');
      }
    }catch(e){}
  }

  /* ---------- (27) السكيلتون بدل «جاري التحميل…» ---------- */
  function skeletonEl(el){
    try{
      if(!el||el.nodeType!==1||el.children.length)return;
      var tx=(el.textContent||'').trim();
      if(tx==='جاري التحميل…'||tx==='جاري التحميل...'){
        el.classList.add('skeleton-holder');
        el.innerHTML='<div class="skel skel-line"></div><div class="skel skel-line short"></div><div class="skel skel-card"></div>';
      }
    }catch(e){}
  }
  function skeletonScan(root){
    try{
      if(root.nodeType===3){ skeletonEl(root.parentNode); return; }
      if(root.nodeType!==1)return;
      skeletonEl(root);
      var list=root.querySelectorAll?root.querySelectorAll('div,small,section,span'):[];
      for(var i=0;i<list.length;i++)skeletonEl(list[i]);
    }catch(e){}
  }

  /* ---------- (28) اهتزاز خفيف ---------- */
  var HAPTIC=true; try{HAPTIC=localStorage.getItem('shehab_haptic')!=='0'}catch(e){}
  function haptic(ms){ if(!HAPTIC)return; try{if(navigator.vibrate)navigator.vibrate(ms||10)}catch(e){} }
  window.haptic=haptic;
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('button,[role="button"],.swatch,.sec-item,.offer-card,.hero-card'):null;
    if(t)haptic(8);
  },true);

  /* ---------- مراقبة الـ DOM: تطبيق lazy + skeleton على الجديد ---------- */
  try{
    var ap=G('app');
    if(ap&&window.MutationObserver){
      new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){
          var added=muts[i].addedNodes;
          for(var j=0;j<added.length;j++){
            var n=added[j];
            if(n&&n.nodeType===1){ lazyify(n); skeletonScan(n); }
            else if(n&&n.nodeType===3){ skeletonScan(n); }
          }
        }
      }).observe(ap,{childList:true,subtree:true});
    }
    lazyify(document); skeletonScan(document.body);
  }catch(e){}

  /* ---------- (13) بحث فوري ---------- */
  var SR_SEC=null;
  async function loadSearchData(){
    try{ if(!(typeof OF!=='undefined'&&OF&&OF.length)){ OF=await callC('offers'); } }catch(e){}
    try{ if(!SR_SEC){ SR_SEC=await callC('sections')||[]; } }catch(e){}
  }
  function allSearchItems(){
    var out=[];
    try{(OF||[]).forEach(function(o){ out.push({kind:'offer',id:o.id,t:o.t,p:o.p,w:o.w,ic:o.ic}) })}catch(e){}
    try{(SR_SEC||[]).forEach(function(s){(s.items||[]).forEach(function(it){ out.push({kind:'sec',id:it.id,t:it.t,p:it.p,w:it.w,ic:it.ic,secName:s.name}) })})}catch(e){}
    return out;
  }
  function runSearch(q){
    var box=G('searchRes'); if(!box)return;
    q=String(q||'').trim();
    if(!q){ box.innerHTML='<small>اكتب اسم صنف أو عرض، وهتلاقيه على طول.</small>'; return; }
    var needle=q.toLowerCase();
    var res=allSearchItems().filter(function(x){ return String(x.t||'').toLowerCase().indexOf(needle)>-1; });
    if(!res.length){ box.innerHTML='<div class="card">مفيش نتايج لـ «'+esc(q)+'»</div>'; return; }
    box.innerHTML=res.slice(0,60).map(function(x){
      var price=x.p?('<div class="p">'+esc(x.p)+' <small>جنيه</small></div>'):'';
      var was=x.w?('<div class="offer-was">'+esc(x.w)+' جنيه</div>'):'';
      var click=x.kind==='offer'?("offerV('"+esc(x.id)+"')"):("secItemV('"+esc(x.id)+"')");
      return '<div class="card search-card" onclick="'+click+'">'+(x.ic?'<img class="ic" src="'+esc(x.ic)+'">':'')+'<b>'+esc(x.t)+'</b>'+price+was+(x.kind==='sec'&&x.secName?'<small style="color:#7b8495">🗂️ '+esc(x.secName)+'</small>':'')+'</div>';
    }).join('');
  }
  function searchV(q){
    V='search'; try{window.__shLastSearch=String(q||'')}catch(e){}
    app('<h2>🔎 بحث</h2><input id="searchQ" type="search" placeholder="ابحث عن صنف أو عرض…" autocomplete="off"><div id="searchRes"></div>');
    var inp=G('searchQ');
    if(inp){ inp.value=q||''; inp.addEventListener('input',function(){ runSearch(inp.value) }); try{inp.focus()}catch(e){} }
    runSearch(q||'');
    loadSearchData().then(function(){ var i=G('searchQ'); runSearch(i?i.value:'') });
  }
  window.searchV=searchV;

  /* زر بحث في شريط الرئيسية */
  try{
    var baseHome=homeV;
    homeV=function(){
      var r=baseHome.apply(this,arguments);
      try{
        var ta=document.querySelector('#app .top-actions');
        if(ta&&!G('searchBtn')){
          var b=document.createElement('button');
          b.type='button'; b.className='g person'; b.id='searchBtn'; b.setAttribute('aria-label','بحث'); b.title='بحث'; b.textContent='🔎';
          b.addEventListener('click',function(){searchV()});
          ta.appendChild(b);
        }
      }catch(e){}
      return r;
    };
  }catch(e){}

  /* ---------- (6) نقاط سلايدر الرئيسية ---------- */
  try{
    var baseHero=drawHero;
    drawHero=function(){
      var r=baseHero.apply(this,arguments);
      try{
        var box=G('of');
        var list=(window.__heroList&&window.__heroList.length)?window.__heroList:featuredOffers();
        var old=document.querySelector('#of .hero-dots');
        if(box&&list.length>1){
          var dots=old||document.createElement('div');
          if(!old){ dots.className='hero-dots'; box.appendChild(dots); }
          var html='';
          for(var i=0;i<list.length;i++) html+='<button type="button" class="hero-dot" data-i="'+i+'" aria-label="عرض '+(i+1)+'"></button>';
          dots.innerHTML=html;
          dots.onclick=function(ev){ var b=ev.target&&ev.target.closest?ev.target.closest('.hero-dot'):null; if(!b)return; ev.stopPropagation(); var i=Number(b.getAttribute('data-i')); if(isFinite(i)){ try{ if(typeof window.heroGoto==='function')window.heroGoto(i); else { HI=i; drawHero(); } }catch(e){} } };
        } else if(old){ old.remove(); }
      }catch(e){}
      return r;
    };
  }catch(e){}

  /* ---------- (12) شكل الكروت ---------- */
  function cardsNow(){try{return localStorage.getItem('shehab_cards')||'normal'}catch(e){return 'normal'}}
  function applyCards(){
    var d=document.documentElement,v=cardsNow();
    d.classList.toggle('cards-round',v==='round');
    d.classList.toggle('cards-glass',v==='glass');
    var l=document.querySelectorAll('.cardshape-btn');
    for(var i=0;i<l.length;i++)l[i].classList.toggle('on',l[i].getAttribute('data-cs')===v);
  }
  function setCards(v){ try{localStorage.setItem('shehab_cards',v)}catch(e){} applyCards(); haptic(10); }
  window.setCards=setCards;window.applyCards=applyCards;
  function buildCardShape(){
    try{
      var box=G('appearanceBox'); if(!box||G('cardShapeRow'))return;
      var row=document.createElement('div'); row.id='cardShapeRow'; row.className='cardshape';
      row.innerHTML="<small>شكل الكروت</small><div class='cardshape-opts'>"+
        "<button type='button' class='g cardshape-btn' data-cs='normal'>▭ عادي</button>"+
        "<button type='button' class='g cardshape-btn' data-cs='round'>⬭ دائري</button>"+
        "<button type='button' class='g cardshape-btn' data-cs='glass'>✦ زجاجي</button></div>";
      box.appendChild(row);
      row.addEventListener('click',function(ev){ var b=ev.target&&ev.target.closest?ev.target.closest('.cardshape-btn'):null; if(!b)return; ev.stopPropagation(); setCards(b.getAttribute('data-cs')); });
    }catch(e){}
  }
  try{
    var baseProf=profileV;
    profileV=async function(){
      var r=await baseProf.apply(this,arguments);
      try{buildCardShape(); applyCards()}catch(e){}
      return r;
    };
  }catch(e){}
  try{applyCards()}catch(e){}
})();
</script>
<style>
/* ===== المرحلة 2: خط زمني للأوردر + سجل النقاط + زر مشاركة ===== */
.ord-steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;font-size:10.5px;line-height:1.4}
.ord-step{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:20px;background:#eef2fb;color:#5b6784;white-space:nowrap}
.ord-step i{width:7px;height:7px;border-radius:50%;background:#c2cbdd;display:inline-block}
.ord-step.done{background:#e7f6ec;color:#1f7a3d}
.ord-step.done i{background:#2e9e4f}
.ord-step.on{background:#0b2a6f;color:#fff}
.ord-step.on i{background:#fff}
.ord-step.bad{background:#fdeaea;color:#b3261e}
.ord-step.bad.on{background:#d32f2f;color:#fff}
html.dark .ord-step{background:#1b2338;color:#9aa6c2}
html.dark .ord-step.done{background:#16301f;color:#7fd39a}
html.dark .ord-step.on{background:#4f74d8;color:#fff}
.ord-arrow{color:#9aa6c2}
.pt-log{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eef1f7;font-size:13px}
.pt-log .pos{color:#1f7a3d;font-weight:700}
.pt-log .neg{color:#b3261e;font-weight:700}
.pt-log small{color:#8b93a6}
html.dark .pt-log{border-color:#232d49}
.share-img-btn{margin-top:10px}
@media print{.ord-steps{display:none}}
</style>
<script>
/* ===== المرحلة 2: نغمة لكل حالة أوردر + خط زمني + سجل نقاط + مشاركة كصورة + طباعة/تصدير CSV ===== */
(function(){
  'use strict';
  function G(id){return document.getElementById(id)}
  function T(msg,k){ try{ if(typeof toast==='function')toast(msg,k); else if(window.toast)window.toast(msg,k) }catch(e){} }
  function H(ms){ try{ if(typeof haptic==='function')haptic(ms||8) }catch(e){} }

  /* ============ (26) نغمة مختلفة لكل حالة أوردر (للموظفين) ============ */
  var AC=null;
  function seqFor(status){
    return {
      new:[[880,0,.11],[1175,.12,.12]],
      ordered:[[660,0,.13],[880,.14,.13]],
      arrived:[[740,0,.11],[880,.12,.11],[1046,.24,.13]],
      delivering:[[523,0,.13],[659,.14,.13],[523,.29,.13]],
      done:[[659,0,.10],[880,.11,.10],[1175,.22,.14]],
      unavailable:[[330,0,.22],[247,.24,.30]]
    }[status]||[[700,0,.14]];
  }
  function playStatus(status){
    try{
      var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
      if(!AC)AC=new C();
      if(AC.state==='suspended'){ try{AC.resume()}catch(e){} }
      var t0=AC.currentTime+0.01;
      seqFor(status).forEach(function(n){
        var o=AC.createOscillator(),g=AC.createGain();
        o.type='sine'; o.frequency.value=n[0];
        g.gain.setValueAtTime(0.0001,t0+n[1]);
        g.gain.exponentialRampToValueAtTime(0.30,t0+n[1]+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+n[2]);
        o.connect(g); g.connect(AC.destination);
        o.start(t0+n[1]); o.stop(t0+n[1]+n[2]+0.03);
      });
    }catch(e){}
  }
  window.playStatusTone=playStatus;

  var lastStat={};
  function isStaffRole(){ try{ return (typeof S!=='undefined')&&(S.r==='manager'||S.r==='pharmacist'||S.r==='assistant') }catch(e){ return false } }
  function watchStatuses(){
    try{
      if(!isStaffRole())return;
      if(typeof O==='undefined'||!O)return;
      O.forEach(function(o){
        var id=String(o.id),st=String(o.s||'');
        if(lastStat[id]!==undefined && lastStat[id]!==st)playStatus(st);
        lastStat[id]=st;
      });
    }catch(e){}
  }
  setInterval(watchStatuses,8000);

  try{
    var baseUpd=upd;
    upd=async function(id,b){
      var newStatus=(G('ms')&&G('ms').value)||'';
      var r=await baseUpd.apply(this,arguments);
      try{ if(newStatus){ playStatus(newStatus); lastStat[String(id)]=newStatus } }catch(e){}
      return r;
    };
  }catch(e){}

  /* ============ (14) خط زمني لحالة الأوردر ============ */
  var FLOW=['new','ordered','arrived','delivering','done'];
  function stepsHTML(o){
    var st=String(o.s||'new');
    if(st==='unavailable')return '<div class="ord-steps"><span class="ord-step bad on">✕ '+esc((ST.unavailable||['مش متوفر'])[0])+'</span></div>';
    var flow=FLOW.slice();
    if(o.m!=='delivery')flow=flow.filter(function(x){return x!=='delivering'});
    var cur=flow.indexOf(st); if(cur<0)cur=0;
    return '<div class="ord-steps">'+flow.map(function(k,i){
      var cls='ord-step'+(i<cur?' done':(i===cur?' on':''));
      return '<span class="'+cls+'"><i></i>'+esc((ST[k]||[k])[0])+'</span>';
    }).join('<span class="ord-arrow">←</span>')+'</div>';
  }
  try{
    var baseMine=drawMine;
    drawMine=function(L){
      var r=baseMine.apply(this,arguments);
      try{
        var box=G('ls');
        if(box){
          var cards=box.querySelectorAll('.card[data-oid]');
          for(var i=0;i<cards.length;i++){
            var id=cards[i].getAttribute('data-oid');
            var o=(L||[]).find? (L||[]).find(function(x){return String(x.id)===String(id)}) : null;
            if(o&&!cards[i].querySelector('.ord-steps'))cards[i].insertAdjacentHTML('beforeend',stepsHTML(o));
          }
        }
      }catch(e){}
      return r;
    };
  }catch(e){}
  try{
    var baseOpenO=openO;
    openO=function(id){
      var r=baseOpenO.apply(this,arguments);
      try{
        var oO=(typeof O!=='undefined'&&O)?O.find(function(x){return String(x.id)===String(id)}):null;
        var md=G('md');
        if(oO&&md&&md.firstElementChild&&!md.querySelector('.ord-steps'))md.firstElementChild.insertAdjacentHTML('afterbegin',stepsHTML(oO));
      }catch(e){}
      return r;
    };
  }catch(e){}

  /* ============ (19) مشاركة العرض / السلة كصورة ============ */
  function loadImg(src){return new Promise(function(res){ if(!src)return res(null); var im=new Image(); im.crossOrigin='anonymous'; im.onload=function(){res(im)}; im.onerror=function(){res(null)}; im.src=src; });}
  function wrapText(x,text,maxW){var words=String(text||'').split(/\s+/),line='',lines=[];for(var i=0;i<words.length;i++){var t=line?line+' '+words[i]:words[i];if(x.measureText(t).width>maxW&&line){lines.push(line);line=words[i]}else line=t}if(line)lines.push(line);return lines}
  function roundRect(x,l,t,w,h,r){x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath()}
  async function buildShareImage(title,rows,imgSrc){
    var W=1080,Hh=1350,c=document.createElement('canvas');c.width=W;c.height=Hh;var x=c.getContext('2d');
    var g=x.createLinearGradient(0,0,0,Hh);g.addColorStop(0,'#0b2a6f');g.addColorStop(1,'#123a8f');x.fillStyle=g;x.fillRect(0,0,W,Hh);
    x.fillStyle='#fff';x.font='bold 46px sans-serif';x.textAlign='center';x.fillText('صيدليات شهاب',W/2,110);
    x.font='27px sans-serif';x.fillStyle='#cdd9f5';x.fillText('خدمة عملاء سريعة · توصيل واستلام',W/2,158);
    var logo=await loadImg(LOGO); if(logo){ try{x.drawImage(logo,W/2-70,190,140,140)}catch(e){} }
    var cardY=360,cardH=Hh-cardY-150;
    x.fillStyle='#ffffff';roundRect(x,70,cardY,W-140,cardH,28);x.fill();
    var y=cardY+72;
    x.textAlign='right';x.fillStyle='#14213d';x.font='bold 50px sans-serif';
    wrapText(x,title,W-260).slice(0,2).forEach(function(l){x.fillText(l,W-130,y);y+=62});
    var pic=await loadImg(imgSrc);
    if(pic){ try{ y+=14; var ph=280; x.drawImage(pic,W-130-ph,y,ph,ph); y+=ph+24 }catch(e){} }
    x.font='34px sans-serif';x.fillStyle='#3a4a6b';
    rows.forEach(function(r){ x.fillText(r,W-130,y); y+=52 });
    x.textAlign='center';x.fillStyle='#cdd9f5';x.font='26px sans-serif';
    x.fillText('للطلب: واتساب أو من التطبيق',W/2,Hh-76);
    return c;
  }
  function shareCanvas(canvas,filename,text){
    try{
      canvas.toBlob(async function(blob){
        if(!blob)return;
        var file=new File([blob],filename,{type:'image/png'});
        try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text:text||''}); return } }catch(e){}
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
        T('تم تنزيل صورة المشاركة ✔','ok');
      },'image/png',0.95);
    }catch(e){ T('تعذر إنشاء الصورة','bad') }
  }
  window.shareOfferImage=async function(id){
    try{
      var o=(typeof OF!=='undefined'&&OF)?OF.find(function(v){return String(v.id)===String(id)}):null; if(!o)return;
      T('جاري تجهيز الصورة…');
      var rows=[]; if(o.p)rows.push('السعر: '+o.p+' جنيه'); if(o.w)rows.push('قبل الخصم: '+o.w+' جنيه'); if(o.x)rows.push(String(o.x).slice(0,80));
      var c=await buildShareImage(o.t||'عرض',rows,o.ic||LOGO);
      shareCanvas(c,'shehab-offer-'+id+'.png',(o.t||'عرض')+' — صيدليات شهاب');
    }catch(e){ T('تعذر المشاركة','bad') }
  };
  window.shareSecItemImage=async function(it){
    try{
      if(!it)return;
      T('جاري تجهيز الصورة…');
      var rows=[]; if(it.p)rows.push('السعر: '+it.p+' جنيه'); if(it.w)rows.push('قبل الخصم: '+it.w+' جنيه'); if(it.x)rows.push(String(it.x).slice(0,80));
      var c=await buildShareImage(it.t||'صنف',rows,it.ic||LOGO);
      shareCanvas(c,'shehab-item-'+String(it.id)+'.png',(it.t||'صنف')+' — صيدليات شهاب');
    }catch(e){ T('تعذر المشاركة','bad') }
  };
  window.shareCartImage=async function(){
    try{
      if(typeof CART==='undefined'||!CART.length){ T('السلة فاضية','bad'); return }
      T('جاري تجهيز الصورة…');
      var rows=CART.slice(0,8).map(function(x){return '• '+(x.t||x.id)+' × '+x.qty});
      var c=await buildShareImage('سلة طلبي',rows,CART[0]&&CART[0].ic);
      shareCanvas(c,'shehab-cart.png','سلة طلبي من صيدليات شهاب');
    }catch(e){ T('تعذر المشاركة','bad') }
  };
  try{
    var baseOfferV=offerV;
    offerV=function(id,fromCache){
      var r=baseOfferV.apply(this,arguments);
      try{
        var d=G('app')&&G('app').querySelector('.offer-detail');
        if(d&&!d.querySelector('.share-img-btn')){
          var b=document.createElement('button');b.type='button';b.className='g share-img-btn';b.textContent='🖼️ شارك العرض كصورة';
          b.addEventListener('click',function(ev){ev.stopPropagation();H();window.shareOfferImage(id)});
          d.appendChild(b);
        }
      }catch(e){}
      return r;
    };
  }catch(e){}
  try{
    var baseCartV=cartV;
    cartV=function(){
      var r=baseCartV.apply(this,arguments);
      try{
        if(G('app')&&!G('shareCartBtn')){
          var b=document.createElement('button');b.type='button';b.id='shareCartBtn';b.className='g';b.textContent='🖼️ شارك السلة كصورة';
          b.addEventListener('click',function(ev){ev.stopPropagation();H();window.shareCartImage()});
          var est=G('cartEstimate'); if(est)est.insertAdjacentElement('afterend',b);
        }
      }catch(e){}
      return r;
    };
  }catch(e){}

  /* ============ (22) طباعة + تصدير CSV (للموظفين) ============ */
  function csvEsc(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
  function downloadFile(name,content,mime){
    try{
      var blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
    }catch(e){ T('تعذر التنزيل','bad') }
  }
  window.exportOrdersCSV=function(){
    try{
      var L=(typeof O!=='undefined'&&O)?O.slice():[];
      var head=['رقم الطلب','الصنف','العميل','التليفون','الحالة','الوقت','الطريقة','العنوان','الإجمالي'];
      var lines=[head.map(csvEsc).join(',')];
      L.forEach(function(o){
        var t=ST[o.s]||ST.new;
        lines.push([o.id,o.i,o.c,o.p,t[0],o.d?new Date(o.d).toLocaleString('ar-EG'):'',o.m=='delivery'?'توصيل':'استلام من الصيدلية',o.a||'',o.total||''].map(csvEsc).join(','));
      });
      downloadFile('shehab-orders-'+new Date().toISOString().slice(0,10)+'.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8');
      T('تم تصدير الطلبات ✔','ok');
    }catch(e){ T('تعذر التصدير','bad') }
  };
  window.printOrders=function(){
    try{
      var L=(typeof O!=='undefined'&&O)?O.slice():[];
      var rows=L.map(function(o){var t=ST[o.s]||ST.new;return '<tr><td>'+esc(o.id)+'</td><td>'+esc(o.i)+'</td><td>'+esc(o.c)+'</td><td dir="ltr">'+esc(o.p)+'</td><td>'+esc(t[0])+'</td><td dir="ltr">'+(o.d?esc(new Date(o.d).toLocaleString('ar-EG')):'')+'</td></tr>'}).join('');
      var w=window.open('','_blank');
      if(!w){ T('المتصفح منع نافذة الطباعة','bad'); return }
      w.document.write('<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>طلبات صيدليات شهاب</title><style>body{font-family:sans-serif;padding:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #999;padding:6px;text-align:right}h2{text-align:center;color:#0b2a6f}</style></head><body><h2>طلبات صيدليات شهاب — '+esc(new Date().toLocaleString('ar-EG'))+'</h2><table><thead><tr><th>رقم</th><th>الصنف</th><th>العميل</th><th>التليفون</th><th>الحالة</th><th>الوقت</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>');
      w.document.close(); setTimeout(function(){try{w.print()}catch(e){}},400);
    }catch(e){ T('تعذر الطباعة','bad') }
  };
  window.printOneOrder=function(id){
    try{
      var o=(typeof O!=='undefined'&&O)?O.find(function(x){return String(x.id)===String(id)}):null; if(!o)return;
      var t=ST[o.s]||ST.new;
      var w=window.open('','_blank'); if(!w){ T('المتصفح منع نافذة الطباعة','bad'); return }
      w.document.write('<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>بون '+esc(o.id)+'</title><style>body{font-family:sans-serif;padding:20px;max-width:420px;margin:auto}h2{text-align:center;color:#0b2a6f}div{margin:6px 0;font-size:15px}hr{border:none;border-top:1px dashed #999}</style></head><body><h2>صيدليات شهاب</h2><hr><div>رقم الطلب: <b>'+esc(o.id)+'</b></div><div>الصنف: '+esc(o.i)+'</div><div>العميل: '+esc(o.c)+'</div><div>التليفون: <span dir="ltr">'+esc(o.p)+'</span></div><div>الحالة: '+esc(t[0])+'</div><div>الطريقة: '+(o.m=='delivery'?'توصيل':'استلام من الصيدلية')+'</div>'+(o.a?'<div>العنوان: '+esc(o.a)+'</div>':'')+(o.total?'<div>الإجمالي: '+esc(o.total)+' جنيه</div>':'')+'<div>التاريخ: <span dir="ltr">'+esc(o.d?new Date(o.d).toLocaleString('ar-EG'):'')+'</span></div><hr><div style="text-align:center">شكرًا لتعاملكم معنا</div></body></html>');
      w.document.close(); setTimeout(function(){try{w.print()}catch(e){}},400);
    }catch(e){ T('تعذر الطباعة','bad') }
  };
  try{
    var baseListV=listV;
    listV=function(){
      var r=baseListV.apply(this,arguments);
      try{
        var head=G('app')&&G('app').querySelector('.list-head');
        if(head&&!G('ordTools')){
          var bar=document.createElement('div');bar.id='ordTools';bar.className='row';bar.style.margin='6px 0';
          bar.innerHTML='<button type="button" class="g" id="ordCsvBtn">📊 تصدير CSV</button><button type="button" class="g" id="ordPrintBtn">🖨️ طباعة</button>';
          head.insertAdjacentElement('afterend',bar);
          if(G('ordCsvBtn'))G('ordCsvBtn').addEventListener('click',window.exportOrdersCSV);
          if(G('ordPrintBtn'))G('ordPrintBtn').addEventListener('click',window.printOrders);
        }
      }catch(e){}
      return r;
    };
  }catch(e){}
  try{
    var baseOpenO2=openO;
    openO=function(id){
      var r=baseOpenO2.apply(this,arguments);
      try{
        var md=G('md');
        if(md&&md.firstElementChild&&!md.querySelector('.printOneBtn')){
          var b=document.createElement('button');b.type='button';b.className='g printOneBtn';b.textContent='🖨️ طباعة البون';
          b.addEventListener('click',function(){window.printOneOrder(id)});
          md.firstElementChild.appendChild(b);
        }
      }catch(e){}
      return r;
    };
  }catch(e){}

  /* ============ (16) سجل النقاط ============ */
  function buildPointsHistory(){
    try{
      var box=G('profile'); if(!box||G('ptHistCard'))return;
      if(!(typeof S!=='undefined'&&S.r==='customer'))return;
      box.insertAdjacentHTML('beforeend','<div class="card" id="ptHistCard"><b>📜 سجل النقاط</b><div class="rating-note">اعرف كل حركات نقاطك (مكسب واستبدال).</div><button class="g" id="ptHistBtn" style="width:auto;margin-top:6px">اعرض السجل</button><div id="ptHistBox"></div></div>');
      var b=G('ptHistBtn'); if(!b)return;
      b.addEventListener('click',async function(){
        b.disabled=true;b.textContent='جاري التحميل…';
        try{
          var d=await call('loyaltyHistory');
          var L=(d&&d.log)||[];
          var box2=G('ptHistBox');
          if(!L.length)box2.innerHTML='<div class="rating-note">مفيش حركات نقاط لسه.</div>';
          else box2.innerHTML='<div style="margin-top:6px">'+L.map(function(x){
            var plus=Number(x.d)>=0;
            return '<div class="pt-log"><span>'+esc(x.r||'نقاط')+'</span><span dir="ltr" class="'+(plus?'pos':'neg')+'">'+(plus?'+':'')+Number(x.d)+'</span><small dir="ltr">'+(x.t?new Date(x.t).toLocaleDateString('ar-EG'):'')+'</small></div>';
          }).join('')+'</div>';
          b.textContent='تحديث السجل';b.disabled=false;
        }catch(e){ T(em(e),'bad'); b.disabled=false; b.textContent='اعرض السجل'; }
      });
    }catch(e){}
  }
  try{
    var baseProf2=profileV;
    profileV=async function(){
      var r=await baseProf2.apply(this,arguments);
      try{buildPointsHistory()}catch(e){}
      return r;
    };
  }catch(e){}
})();
</script>

<style>

<script>
(function(){
  var LOW_SHOW=5;
  function cdText(ms){
    if(ms<=0)return 'انتهى';
    var m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mi=m%60;
    if(d>0)return d+' يوم'+(h?' و'+h+' ساعة':'');
    if(h>0)return h+' ساعة'+(mi?' و'+mi+' دقيقة':'');
    return (mi||1)+' دقيقة';
  }
  function dtIn(ms){ms=Number(ms)||0;if(!ms)return '';function p(x){return (x<10?'0':'')+x}var d=new Date(ms);return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
  function offerState(o){o=o||{};var now=Date.now(),s=Number(o.start)||0,e=Number(o.end)||0;return{future:!!(s&&now<s),expired:!!(e&&now>=e),start:s,end:e}}
  function findOffer(id){try{return (typeof OF!=='undefined'?OF:[]).find(function(x){return String(x.id)==String(id)})}catch(e){return null}}
  function stockHtml(q,always){
    if(typeof q!=='number'||q<0)return '';
    if(q===0)return '<span class="stk out">نفدت الكمية</span>';
    if(always||q<=LOW_SHOW)return '<span class="stk'+(q<=3?' low':'')+'">متبقي '+q+'</span>';
    return '';
  }
  function offerBadges(o,always){
    try{
      var st=offerState(o),h='';
      if(st.future)h+='<span class="offer-cd future">يبدأ بعد '+cdText(st.start-Date.now())+'</span>';
      else if(st.expired)h+='<span class="offer-cd">انتهى العرض</span>';
      else if(st.end)h+='<span class="offer-cd" data-end="'+st.end+'">ينتهي بعد '+cdText(st.end-Date.now())+'</span>';
      h+=stockHtml(o.q,always);
      return h;
    }catch(e){return ''}
  }
  function sh3Tick(){
    try{
      var els=document.querySelectorAll('[data-end]');
      for(var i=0;i<els.length;i++){var e=Number(els[i].getAttribute('data-end'));if(!e)continue;var ms=e-Date.now();if(ms<=0){els[i].textContent='انتهى العرض';els[i].classList.add('expired')}else{els[i].textContent='ينتهي بعد '+cdText(ms)}}
    }catch(e){}
  }
  function secQtyMap(){
    var m={};
    try{var ce=(typeof cGet==='function')?cGet('sections'):null;var arr=ce&&ce.v?ce.v:[];arr.forEach(function(s){(s.items||[]).forEach(function(it){m[String(it.id)]=(typeof it.q==='number')?it.q:-1})})}catch(e){}
    return m;
  }
  function sh3Decorate(){
    try{
      var cards=document.querySelectorAll('.offer-card, .hero-card');
      for(var i=0;i<cards.length;i++){
        var c=cards[i];
        if(c.getAttribute('data-sh3'))continue;c.setAttribute('data-sh3','1');
        var id='';
        if(c.classList.contains('hero-card'))id=String(c.getAttribute('data-oid')||'');
        else{var mm=(c.getAttribute('onclick')||'').match(/'([^']+)'/);id=mm?mm[1]:''}
        var o=findOffer(id);if(!o)continue;
        var b=offerBadges(o,false);if(b)c.insertAdjacentHTML('beforeend',b);
        var st=offerState(o);if(st.expired||st.future)c.style.opacity='.6';
      }
      var det=document.querySelector('.offer-detail');
      if(det&&!det.getAttribute('data-sh3')){
        det.setAttribute('data-sh3','1');
        var o2=findOffer(String(window.__shLastOfferId||''));
        if(o2){var b2=offerBadges(o2,true);if(b2)det.insertAdjacentHTML('beforeend',b2)}
      }
      var sq=secQtyMap();
      var items=document.querySelectorAll('.sec-item[data-id]');
      for(var j=0;j<items.length;j++){
        var el=items[j];
        if(el.getAttribute('data-sh3'))continue;el.setAttribute('data-sh3','1');
        var q=sq[String(el.getAttribute('data-id'))];
        if(typeof q!=='number')continue;
        var h=stockHtml(q,false);if(h)el.insertAdjacentHTML('afterbegin',h);
      }
    }catch(e){}
  }
  setInterval(sh3Tick,30000);
  function bootSh3(){
    try{
      var ap=$('app');
      if(ap&&window.MutationObserver){var t=0;new MutationObserver(function(){if(t)return;t=setTimeout(function(){t=0;sh3Decorate()},130)}).observe(ap,{childList:true,subtree:true})}
      sh3Decorate();
    }catch(e){}
  }
  /* محرر العرض: جدولة + مخزون */
  var baseOffE=offE;
  offE=function(id){
    baseOffE.apply(this,arguments);
    try{
      var md=$('md'); if(!md||$('ostart'))return;
      var o=findOffer(id||'')||{};
      var box=document.createElement('div');
      box.innerHTML='<label>يبدأ العرض (اختياري)</label><input id="ostart" type="datetime-local" value="'+dtIn(o.start)+'"><label>ينتهي العرض (اختياري)</label><input id="oend" type="datetime-local" value="'+dtIn(o.end)+'"><label>كمية المخزون (اتركها فاضية لو مش محدودة)</label><input id="oqty" type="number" min="0" step="1" placeholder="مثال: 20" value="'+((typeof o.q==='number'&&o.q>=0)?o.q:'')+'"><small>لو حددت كمية، التطبيق ينقصها تلقائيًا مع كل طلب وينبهك قبل ما تخلص.</small>';
      var er=md.querySelector('#er');
      if(er&&er.parentNode)er.parentNode.insertBefore(box,er);
      else if(md.firstElementChild)md.firstElementChild.appendChild(box);
    }catch(e){}
  };
  /* حفظ العرض مع الجدولة والمخزون */
  osave=async function(id,b){
    try{
      var p=$('oprice').value,w=$('ooldprice').value;
      if(p&&w&&Number(w)<=Number(p))throw 'السعر قبل الخصم لازم يكون أكبر من السعر الحالي';
      b.disabled=1;
      var start=$('ostart')?$('ostart').value:'',end=$('oend')?$('oend').value:'',qty=$('oqty')?$('oqty').value:'';
      await call('osave',{id:id,ti:$('ot').value,tx:$('ox').value,price:p,oldPrice:w,ic:IC,featured:$('ofeatured').checked,start:start,end:end,qty:qty});
      $('md').remove();
      OF=await callC('offers');
      if(V=='off')drawO();
      drawHero();
    }catch(x){var er=$('er');if(er)er.textContent=em(x);if(b)b.disabled=0}
  };
  /* الرئيسية: استبعاد العروض غير المتاحة من المميزة */
  var baseDrawHero=drawHero;
  drawHero=function(){
    try{if(typeof S!=='undefined'&&S&&S.r==='customer'){
      if(OF&&OF.length){
        var live=OF.filter(function(o){var st=offerState(o);return !(st.expired||st.future)});
        if(live.length!==OF.length){OF.length=0;live.forEach(function(o){OF.push(o)})}
      }
    }}catch(e){}
    return baseDrawHero.apply(this,arguments);
  };
  var baseDrawO=drawO;
  drawO=function(){var r=baseDrawO.apply(this,arguments);try{sh3Decorate()}catch(e){};return r};
  /* السلة: منع تجاوز المخزون */
  var baseCartSetQty=cartSetQty;
  cartSetQty=function(id,n){
    try{
      var o=findOffer(id);
      if(o){
        var st=offerState(o);
        if(Number(n)>0&&(st.expired||st.future)){toast('العرض ده مش متاح حاليًا','bad');return}
        if(Number(n)>0&&o.q===0){toast('نفدت الكمية من العرض ده','bad');return}
        if(o.q>0&&Number(n)>o.q){toast('الكمية المتاحة '+o.q+' بس','bad');n=o.q}
      }
    }catch(e){}
    return baseCartSetQty.apply(this,arguments);
  };
  /* كانبان الطلبات */
  var KB_ORDER=['new','ordered','delivering','arrived','done','unavailable'];
  function kbCard(o){
    var t=ST[o.s]||ST.new;
    return '<div class="card kb-card" style="border-color:'+t[1]+'"><b onclick="openO(\''+esc(o.id)+'\')">'+esc(o.i||'')+'</b>'+
      '<div class="rating-note">'+esc(o.c||'')+' — <a href="tel:'+esc(o.p||'')+'" dir="ltr" onclick="event.stopPropagation()">'+esc(o.p||'')+'</a></div>'+
      '<div class="rating-note">'+fmt(o.d,{dateStyle:'short',timeStyle:'short'})+'</div>'+
      '<select onchange="window.kbMove(\''+esc(o.id)+'\',this.value,this)">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(k==o.s?' selected':'')+'>'+ST[k][0]+'</option>'}).join('')+'</select></div>';
  }
  function renderKanban(){
    var el=$('ls'); if(!el)return;
    var qt=$('q')?$('q').value.trim().toLowerCase():'',fv=$('fl')?$('fl').value:'';
    var L=(O||[]).filter(function(o){return (!fv||o.s==fv)&&(!qt||((o.i+o.c+o.p)||'').toLowerCase().indexOf(qt)>=0)});
    el.innerHTML='<div class="kb-wrap">'+KB_ORDER.map(function(k){
      var t=ST[k]||ST.new,items=L.filter(function(o){return o.s==k});
      return '<div class="kb-col"><div class="kb-head" style="background:'+t[1]+'"><span>'+t[0]+'</span><span>'+items.length+'</span></div><div class="kb-body">'+
        (items.length?items.map(kbCard).join(''):'<div class="rating-note" style="padding:6px">فاضي</div>')+'</div></div>';
    }).join('')+'</div>';
  }
  window.kbMove=async function(id,s){
    if(s==='ordered'||s==='delivering'){try{openO(id)}catch(e){};return}
    try{
      var o=(O||[]).find(function(x){return String(x.id)==String(id)});
      await call('upd',{id:id,s:s,e:'',sr:o?o.sr:''});
      if(o)o.s=s;
      toast('تم تحديث الحالة ✔','ok');
    }catch(e){toast(em(e),'bad')}
    try{renderKanban()}catch(e){}
  };

  /* لوحة الإحصائيات */
  function statCard(label,val){return '<div class="st3-card"><b>'+esc(String(val))+'</b><small>'+esc(label)+'</small></div>'}
  function renderStats(d){

    var by=d.byStatus||{};
    var statusRows=Object.keys(ST).map(function(k){return '<div class="st3-row"><span class="chip" style="background:'+ST[k][1]+'">'+ST[k][0]+'</span><b>'+(by[k]||0)+'</b></div>'}).join('');
    var maxDay=1;(d.byDay||[]).forEach(function(x){if(x.c>maxDay)maxDay=x.c});

    var tops=(d.topItems||[]).map(function(x){return '<div class="st3-row"><span>'+esc(x.n)+'</span><b>'+x.c+'</b></div>'}).join('')||'<div class="rating-note">مفيش بيانات</div>';
    var lows=(d.low||[]).map(function(x){return '<div class="st3-row"><span>'+esc(x.n)+'</span><span class="stk '+(x.q<=0?'out':'low')+'">'+(x.q<=0?'نفدت':'متبقي '+x.q)+'</span><button class="g" style="width:auto" onclick="window.stockEdit(\''+esc(x.id)+'\','+x.q+')">تعديل</button></div>'}).join('')||'<div class="rating-note">كل الكميات تمام ✅</div>';
    b.innerHTML='<div class="st3-grid">'+statCard('إجمالي الطلبات',d.orders)+statCard('طلبات النهاردة',d.today)+statCard('آخر 7 أيام',d.week)+statCard('إجمالي المبيعات',d.revenue+' ج')+statCard('متوسط الطلب',d.avg+' ج')+statCard('طلبات مُسلّمة',d.done)+statCard('عدد العملاء',d.customers)+statCard('نقاط ممنوحة',d.points)+'</div>'+
      '<div class="card"><b>الطلبات حسب الحالة</b>'+statusRows+'</div>'+
      '<div class="card"><b>طلبات آخر 7 أيام</b><div class="st3-bars">'+bars+'</div></div>'+
      '<div class="card"><b>الأكثر طلبًا</b>'+tops+'</div>'+
      '<div class="card"><b>⚠️ نواقص المخزون'+(d.lowThreshold!=null?' (حتى '+d.lowThreshold+')':'')+'</b>'+lows+'</div>'+
      '<small class="rating-note">العروض النشطة: '+(d.offers||0)+' · الأقسام: '+(d.sections||0)+'</small>';
  }
  window.statsV=async function(){
    V='profile';
    app('<h2>📊 لوحة الإحصائيات</h2><div id="stBody"><div class="rating-note">جاري التحميل…</div></div>');
    try{var d=await call('stats');renderStats(d)}catch(e){var b=$('stBody');if(b)b.innerHTML='<div class="err">'+esc(em(e))+'</div>'}
  };
  window.stockEdit=async function(id,cur){
    var v=window.prompt('الكمية الجديدة للمخزون',String(cur));
    if(v===null)return;var q=Math.floor(Number(v));if(!isFinite(q)||q<0){toast('كمية غير صحيحة','bad');return}
    try{await call('stockSet',{id:id,qty:q});toast('تم تحديث الكمية ✔','ok');window.statsV()}catch(e){toast(em(e),'bad')}
  };
  /* النسخ الاحتياطي وسجل المراجعة */
  async function loadBackups(){
    var el=$('bkList'); if(!el)return;
    try{var L=await call('backupList');
      el.innerHTML='<b>آخر النسخ الاحتياطية</b>'+(L.length?L.map(function(f){return '<div class="st3-row"><a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.name)+'</a><small dir="ltr">'+(f.size?Math.round(f.size/1024)+' KB':'')+'</small></div>'}).join(''):'<div class="rating-note">مفيش نسخ بعد</div>');
    }catch(e){el.innerHTML='<div class="err">'+esc(em(e))+'</div>'}
  }
  async function loadAudit(){

    try{var L=await call('auditList');
      el.innerHTML=L.length?L.map(function(x){return '<div class="st3-log"><span>'+esc(x.n||x.ph)+'</span><span class="chip" style="background:#0b2a6f">'+esc(x.a)+'</span><small dir="ltr">'+(x.t?new Date(x.t).toLocaleString('ar-EG'):'')+'</small></div>'}).join(''):'<div class="rating-note">مفيش عمليات مسجلة</div>';
    }catch(e){el.innerHTML='<div class="err">'+esc(em(e))+'</div>'}

  async function doBackup(){
    var b=$('bkNow'); if(!b||b.disabled)return; b.disabled=true; var t=b.textContent; b.textContent='⏳ جاري النسخ…';
    try{await call('backupNow');toast('تم إنشاء نسخة احتياطية ✔','ok');loadBackups()}catch(e){toast(em(e),'bad')}
    finally{b.disabled=false;b.textContent=t}
  }
  window.backupV=async function(){
    V='profile';
    app('<h2>🗄️ النسخ الاحتياطي وسجل المراجعة</h2><div class="profile-field"><button class="g" id="bkNow">💾 إنشاء نسخة احتياطية الآن</button><small>النسخة بتتحفظ في Google Drive.</small></div><div class="profile-field" id="bkList"><div class="rating-note">جاري التحميل…</div></div><h3>📜 آخر العمليات</h3><div id="auditList"><div class="rating-note">جاري التحميل…</div></div>');
    var bn=$('bkNow'); if(bn)bn.addEventListener('click',doBackup);
    loadBackups(); loadAudit();

  /* أزرار الإدارة في شاشة حسابي */
  function addAdminButtons(){
    try{
      var p=$('profile'); if(!p||$('sh3AdminBox'))return;
      if(!(typeof S!=='undefined'&&S&&S.r!=='customer'))return;
      var box=document.createElement('div');box.className='profile-field';box.id='sh3AdminBox';
      var html='<hr><h3>🛠️ أدوات الإدارة</h3><button class="g" type="button" id="sh3Stats">📊 لوحة الإحصائيات</button>';
      if(S.r==='manager')html+='<button class="g" type="button" id="sh3Backup">🗄️ النسخ الاحتياطي وسجل المراجعة</button>';
      box.innerHTML=html;p.appendChild(box);
      var b1=$('sh3Stats');if(b1)b1.addEventListener('click',function(){window.statsV()});
      var b2=$('sh3Backup');if(b2)b2.addEventListener('click',function(){window.backupV()});

  var baseProfileV=profileV;
  profileV=async function(){var r=await baseProfileV.apply(this,arguments);try{addAdminButtons()}catch(e){};return r};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootSh3);else bootSh3();
})();

<script>
(function(){
  'use strict';
  function G(id){return document.getElementById(id)}
  function E(s){try{return (typeof esc==='function')?esc(s==null?'':s):String(s==null?'':s)}catch(e){return String(s==null?'':s)}}
  function EMx(x){try{return (typeof em==='function')?em(x):String(x&&x.message||x)}catch(e){return String(x&&x.message||x)}}
  function CO(m,k){try{if(typeof toast==='function')toast(m,k)}catch(e){}}
  function APPH(h){try{if(typeof app==='function')app(h);else G('app').innerHTML=h}catch(e){try{G('app').innerHTML=h}catch(e2){}}}
  function LOGOURL(){try{return (typeof LOGO!=='undefined')?LOGO:''}catch(e){return ''}}

  /* ====== 1) شيت المشاركة: يعرض التطبيقات اللي تقدر تبعت عليها اللينك ====== */
  window.openShareSheet=function(o){
    o=o||{};
    var url=o.url||location.href, text=o.text||'', title=o.title||'صيدليات شهاب';
    var old=G('shShareSheet'); if(old){try{old.parentNode.removeChild(old)}catch(e){}}
    var enc=encodeURIComponent, full=(text?(text+'\n'):'')+url;
    var apps=[
      ['واتساب','💬','#25D366','https://wa.me/?text='+enc(full)],
      ['تيليجرام','✈️','#229ED9','https://t.me/share/url?url='+enc(url)+'&text='+enc(text)],
      ['فيسبوك','📘','#1877F2','https://www.facebook.com/sharer/sharer.php?u='+enc(url)],
      ['إكس (تويتر)','✖️','#111111','https://twitter.com/intent/tweet?url='+enc(url)+'&text='+enc(text)],
      ['رسالة نصية','✉️','#0ea5e9','sms:?&body='+enc(full)],
      ['بريد إلكتروني','📧','#6b7280','mailto:?subject='+enc(title)+'&body='+enc(full)]
    ];
    var m=document.createElement('div'); m.className='m'; m.id='shShareSheet';
    var html='<div><b style="font-size:17px">📤 شارك عبر</b>'+
      '<small>اختار التطبيق اللي تحب تبعت عليه اللينك</small><div class="shsh-grid">';
    apps.forEach(function(a){
      html+='<button type="button" class="shsh-app" data-u="'+E(a[3])+'" style="background:'+a[2]+'"><span class="e">'+a[1]+'</span><span>'+a[0]+'</span></button>';
    });
    html+='</div>';
    if(navigator.share)html+='<button type="button" class="g" id="shMore">📱 تطبيقات أخرى…</button>';
    html+='<button type="button" class="g" id="shCopy">📋 نسخ الرابط</button>'+
      '<button type="button" class="g" id="shClose" style="margin-top:6px">إغلاق</button></div>';
    m.innerHTML=html;
    document.body.appendChild(m);
    function close(){try{if(m.parentNode)m.parentNode.removeChild(m)}catch(e){}}
    function copyNow(){
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(url).then(function(){CO('تم نسخ الرابط ✔','ok')},function(){try{prompt('انسخ الرابط:',url)}catch(e){}});
        } else { try{prompt('انسخ الرابط:',url)}catch(e){} }
      }catch(e){try{prompt('انسخ الرابط:',url)}catch(e2){}}
    }
    m.addEventListener('click',function(ev){
      if(ev.target===m){close();return}
      var t=ev.target, b=t&&t.closest?t.closest('[data-u]'):null;
      if(b){var u=b.getAttribute('data-u');try{if(/^https?:\/\//i.test(u)){window.open(u,'_blank','noopener')}else{var a=document.createElement('a');a.href=u;document.body.appendChild(a);a.click();setTimeout(function(){try{a.remove()}catch(e){}},400)}}catch(e){}setTimeout(close,180);return}
      if(t&&t.closest&&t.closest('#shCopy')){copyNow();close();return}
      if(t&&t.closest&&t.closest('#shMore')){close();window.openShareSheetNative({url:url,text:text,title:title});return}
      if(t&&t.closest&&t.closest('#shClose')){close();return}
    });
  };
  window.openShareSheetNative=async function(o){
    try{ if(navigator.share){ await navigator.share(o); return } }catch(e){ if(e&&e.name==='AbortError')return }
    try{ await navigator.clipboard.writeText(o.url); CO('تم نسخ الرابط ✔','ok') }catch(e){ try{prompt('انسخ الرابط:',o.url)}catch(e2){} }
  };

  /* ====== 2) شاشة الزائر: عرض/صنف بدون تسجيل دخول ====== */
  function gPrices(d){
    var p=Number(String(d.p||'').replace(',','.')), w=Number(String(d.w||'').replace(',','.'));
    var pc=(d.p&&d.w&&isFinite(p)&&isFinite(w)&&w>p&&p>=0)?Math.round((w-p)/w*100):0;
    var h='<div class="offer-prices">';
    if(d.p)h+='<span class="offer-now">'+E(d.p)+' <small>جنيه</small></span>';
    if(d.w)h+='<span class="offer-was">'+E(d.w)+' جنيه</span>';
    if(pc>0)h+='<span class="off-badge">خصم '+pc+'%</span>';
    return h+'</div>';
  }
  function renderGuest(d,kind){
    d=d||{};
    var h='<img class="lg" src="'+LOGOURL()+'"><h2>صيدليات شهاب</h2>'+
      '<div class="guest-badge">👀 بتشاهد كزائر — تقدر تقرأ التفاصيل، وتسجّل دخول للطلب</div>'+
      '<div class="card offer-detail">';
    if(d.ic)h+='<img class="offer-photo" src="'+E(d.ic)+'" alt="'+E(d.t||'')+'">';
    if(d.secName)h+='<small>القسم: '+E(d.secName)+'</small>';
    h+='<h2>'+E(d.t||'')+'</h2>'+gPrices(d);
    if(kind==='offer'&&d.live===false)h+='<div class="offer-cd">⏳ العرض مش متاح حاليًا (انتهت المدة)</div>';
    if(typeof d.q==='number'&&d.q===0)h+='<div class="stk out">نفدت الكمية</div>';
    h+='<h3>المواصفات والتفاصيل</h3><div class="pw">'+E(d.x||'لا توجد تفاصيل إضافية')+'</div>';
    if(kind==='offer')h+='<h3>تقييم العملاء</h3><div class="rating-note">'+(d.avg?Number(d.avg).toFixed(1):'—')+' من 5 · '+(d.count||0)+' تقييم</div>';
    h+='</div><div class="guest-actions">'+
      '<button onclick="__shGuestOrder()">🛒 اطلب الآن</button>'+
      '<button class="g" onclick="__shGuestShare()">📤 مشاركة</button>'+
      '<button class="g" onclick="authV()">👤 تسجيل الدخول / حساب جديد</button></div>';
    APPH(h);
  }
  window.__shGuestView=function(spec){
    spec=String(spec||'');
    var kind=spec.slice(0,1), id=spec.slice(1);
    if(!id){try{return authV()}catch(e){return null}}
    window.__shGuestId=id; window.__shGuestKind=(kind==='i'?'item':'offer');
    try{ if(typeof V!=='undefined')V='guest' }catch(e){}
    var root=G('app');
    if(root)root.innerHTML='<img class="lg" src="'+LOGOURL()+'"><div class="card" style="text-align:center">⏳ جاري تحميل المحتوى…</div>';
    var act=(kind==='i')?'pubItem':'pubOffer';
    var pr=(typeof call==='function')?call(act,{id:id}):Promise.reject('call غير متاح');
    pr.then(function(d){renderGuest(d,kind)}).catch(function(e){
      APPH('<img class="lg" src="'+LOGOURL()+'"><h2>صيدليات شهاب</h2><div class="card"><div class="err">'+E(EMx(e))+'</div><small>الرابط ممكن يكون قديم أو الصنف اتشال.</small></div><button onclick="authV()">تسجيل الدخول</button>');
    });
  };
  window.__shGuestOrder=function(){
    try{ alert('لازم تسجّل دخول الأول (أو تعمل حساب جديد) عشان تقدر تطلب.\nاضغط «تسجيل الدخول».') }catch(e){}
    try{ authV() }catch(e){}
  };
  window.__shGuestShare=function(){
    var base='https://amersn.github.io/shehabpharmacies/';
    var kind=window.__shGuestKind, id=window.__shGuestId;
    var url=(kind==='item')?(base+'?i='+encodeURIComponent(id)):(base+'?o='+encodeURIComponent(id));
    window.openShareSheet({url:url,text:'شوف ده في صيدليات شهاب',title:'صيدليات شهاب'});
  };
})();
</script>

<style>

<script>
/* ===== شاشة «إعدادات البرنامج»: اهتزاز أثناء الضغط + الوضع الليلي ===== */
(function(){
  function get(id){return document.getElementById(id)}
  function vibOn(){try{return localStorage.getItem('shehab_vibrate')!=='0'}catch(e){return true}}
  function vibrate(ms){try{if(!vibOn())return;if(navigator&&typeof navigator.vibrate==='function')navigator.vibrate(ms||8)}catch(e){}}
  function setVibrate(on){try{localStorage.setItem('shehab_vibrate',on?'1':'0')}catch(e){}if(on)vibrate(15)}
  window.shVibrate=vibrate;window.setVibrate=setVibrate;
  function settingsV(){
    try{V='settings'}catch(e){}
    var darkOn=false;try{darkOn=document.documentElement.classList.contains('dark')}catch(e){}
    var vOn=vibOn();
    var colors=['#0B3D33','#0b2a6f','#0a5ea4','#0e7c66','#33691e','#7b2ff7','#b3261e','#c2185b','#4a4f57'];
    var html='<h2>⚙️ إعدادات البرنامج</h2>'
      +'<div class="card set-row"><div class="set-lbl"><b>📳 اهتزاز أثناء الضغط</b><small>اهتزاز خفيف عند لمس الأزرار</small></div><label class="switch"><input type="checkbox" id="setVib"'+(vOn?' checked':'')+'><span class="slider"></span></label></div>'
      +'<div class="card set-row"><div class="set-lbl"><b>🌙 الوضع الليلي</b><small>مظهر داكن مريح للعين</small></div><label class="switch"><input type="checkbox" id="setDark"'+(darkOn?' checked':'')+'><span class="slider"></span></label></div>'
      +'<div class="card"><h3 style="margin:6px 0 10px">🎨 لون البرنامج</h3><div class="swatches">'+colors.map(function(c){return '<button type="button" class="swatch" data-c="'+c+'" style="background:'+c+'" aria-label="لون"></button>'}).join('')+'</div><small>الاختيار بيتحفظ على الجهاز.</small></div>'
      +'<div class="card"><h3 style="margin:6px 0 8px">🎨 إعدادات الشكل</h3><small>شكل الكروت</small><div class="cardshape-opts"><button type="button" class="g cardshape-btn" data-cs="normal">▭ عادي</button><button type="button" class="g cardshape-btn" data-cs="round">⬭ دائري</button><button type="button" class="g cardshape-btn" data-cs="glass">✦ زجاجي</button></div></div>'
      +'<button class="g" type="button" id="settingsBack">⬅️ رجوع لحسابي</button>';
    try{app(html)}catch(e){try{run(html)}catch(e2){}}
    var vt=get('setVib');if(vt)vt.addEventListener('change',function(){setVibrate(!!vt.checked)});
    var dt=get('setDark');if(dt)dt.addEventListener('change',function(){try{setDark(!!dt.checked)}catch(e){}});
    var bk=get('settingsBack');if(bk)bk.addEventListener('click',function(){try{profileV()}catch(e){}});
    var sws=document.querySelectorAll('#app .swatch');
    for(var i=0;i<sws.length;i++)(function(s){s.addEventListener('click',function(){setAccent(s.getAttribute('data-c'))})})(sws[i]);
    var csb=document.querySelectorAll('#app .cardshape-btn');
    for(var k=0;k<csb.length;k++)(function(b){b.addEventListener('click',function(){try{setCards(b.getAttribute('data-cs'))}catch(e){}})}) (csb[k]);
    try{themeSyncUI()}catch(e){}
    try{applyCards()}catch(e){}
    try{if(typeof navSync==='function')navSync()}catch(e){}
  }
  window.settingsV=settingsV;
  document.addEventListener('pointerdown',function(e){
    try{
      var t=e.target;
      var hit=t&&t.closest?t.closest('button, .switch, .nav-item, .swatch, .offer-card, a[href]'):null;
      if(hit)vibrate(8);
    }catch(x){}
  },true);
})();
</script>

<script>
/* ===== ترتيب نهاية «حسابي»: (عنواننا / تابعونا / اتصل بنا) ← تحديث البرنامج ← تسجيل خروج ===== */
(function(){
  try{
    var FEEDBACK_EMAIL='shehabpharmacytala@gmail.com';
    function feedbackMail(){
      var sub=encodeURIComponent('شكوى أو اقتراح — صيدليات شهاب');
      var body=encodeURIComponent('اكتب شكواك أو اقتراحك هنا:\n\n');
      return 'mailto:'+FEEDBACK_EMAIL+'?subject='+sub+'&body='+body;
    }
    window.shehabFeedback=function(){try{location.href=feedbackMail()}catch(e){}};
    var prev=profileV;
    profileV=async function(){
      var r=await prev.apply(this,arguments);
      try{
        var p=document.getElementById('profile'); if(!p)return r;
        var row=document.getElementById('pfActions');
        var upd=document.getElementById('appUpdateBox');
        var logout=document.getElementById('pfLogout');
        if(logout&&logout.parentNode===p)p.appendChild(logout);
        if(upd&&upd.parentNode===p&&logout&&logout.parentNode===p)p.insertBefore(upd,logout);
        if(row&&row.parentNode===p&&upd&&upd.parentNode===p)p.insertBefore(row,upd);
        else if(row&&row.parentNode===p&&logout&&logout.parentNode===p)p.insertBefore(row,logout);
        /* زر الشكاوى والمقترحات فوق زر تحديث البرنامج (أو فوق تسجيل الخروج لو مفيش زر تحديث) */
        var sug=document.getElementById('pfSuggest');
        if(!sug){
          sug=document.createElement('button');
          sug.type='button'; sug.className='g'; sug.id='pfSuggest';
          sug.textContent='📩 الشكاوى والمقترحات';
          sug.addEventListener('click',function(){window.shehabFeedback()});
        }
        if(sug.parentNode!==p)p.appendChild(sug);
        var anchor=(upd&&upd.parentNode===p)?upd:logout;
        if(anchor&&anchor.parentNode===p)p.insertBefore(sug,anchor);
      }catch(e){}
      return r;
    };
  }catch(e){}
})();
</script>
<script>
/* ===== قناة تيليجرام: نشر العروض الجديدة تلقائيًا (للمدير) ===== */
(function(){
  function el(id){return document.getElementById(id)}
  function msg(id,txt){var e=el(id);if(e)e.textContent=txt||''}
  function render(s){
    var tokenHint=s.tokenSet?'✅ التوكن مضبوط — اتركه فارغًا أو ألصق توكنًا جديدًا':'123456:ABC-DEF... (من @BotFather)';
    var html='<h2>📢 قناة تيليجرام</h2>'
      +'<small>لما تضيف عرض جديد، البوت يبعت رسالة للقناة فيها عنوان العرض وتفاصيله والصورة والسعر ولينك العرض.</small>'
      +'<label for="tgChannel">اسم القناة (مثال: @shehab_offers) أو رقم الـ chat id</label>'
      +'<input id="tgChannel" placeholder="@channel_name" value="'+esc(s.channel||'')+'">'
      +'<label for="tgToken">توكن البوت (من @BotFather)</label>'
      +'<input id="tgToken" placeholder="'+esc(tokenHint)+'" autocomplete="off">'
      +'<div class="card set-row"><div class="set-lbl"><b>🚀 نشر العرض الجديد تلقائيًا</b><small>يبعت رسالة للقناة فور حفظ العرض الجديد</small></div><label class="switch"><input type="checkbox" id="tgAuto"'+(s.auto?' checked':'')+'><span class="slider"></span></label></div>'
      +'<button type="button" id="tgSave">💾 حفظ الإعدادات</button>'
      +'<button type="button" class="g" id="tgTest">📨 إرسال رسالة تجريبية</button>'
      +'<div class="err" id="tgErr"></div>'
      +'<small id="tgLast">حالة آخر إرسال: '+(s.last?esc(s.last):'—')+'</small>'
      +'<button type="button" class="g" id="tgBack">⬅️ رجوع لحسابي</button>';
    try{app(html)}catch(e){try{run(html)}catch(e2){}}
    el('tgSave').onclick=function(){save()};
    el('tgTest').onclick=function(){test()};
    el('tgBack').onclick=function(){try{profileV()}catch(e){}};
  }
  function save(){
    var b=el('tgSave');if(b)b.disabled=true;msg('tgErr','جاري الحفظ…');
    call('tgChannelSet',{channel:String((el('tgChannel')||{}).value||''),token:String((el('tgToken')||{}).value||''),auto:!!(el('tgAuto')&&el('tgAuto').checked)})
      .then(function(){if(el('tgToken'))el('tgToken').value='';msg('tgErr','✅ تم الحفظ. جرّب «إرسال رسالة تجريبية».')})
      .catch(function(x){msg('tgErr',em(x))})
      .then(function(){if(b)b.disabled=false});
  }
  function test(){
    var b=el('tgTest');if(b)b.disabled=true;msg('tgErr','جاري الإرسال…');
    call('tgChannelTest',{})
      .then(function(r){var ok=r&&r.ok;msg('tgErr',ok?'✅ اتبعتت رسالة للقناة.':('⚠️ فشل الإرسال. '+((r&&r.last)||'')));var l=el('tgLast');if(l)l.textContent='حالة آخر إرسال: '+((r&&r.last)||'—')})
      .catch(function(x){msg('tgErr',em(x))})
      .then(function(){if(b)b.disabled=false});
  }
  function open(){
    try{V='tgchan'}catch(e){}
    try{app('<h2>📢 قناة تيليجرام</h2><small>جاري التحميل…</small>')}catch(e){}
    call('tgChannelGet').then(function(s){render(s||{})}).catch(function(x){render({});msg('tgErr',em(x))});
  }
  window.tgPublishOffer=function(btn,id){
    var s=el('tgPub');
    if(s){s.style.color='';s.textContent='جاري النشر على القناة…'}
    if(btn)btn.disabled=true;
    call('tgChannelTest',{id:id})
      .then(function(r){if(s){var ok=r&&r.ok;s.style.color=ok?'#0a7d32':'#b3261e';s.textContent=ok?'✅ اتنشر العرض على قناة تيليجرام.':('⚠️ فشل النشر. '+((r&&r.last)||''))}})
      .catch(function(x){if(s){s.style.color='#b3261e';s.textContent=em(x)}})
      .then(function(){if(btn)btn.disabled=false});
  };
  window.tgChannelV=open;
})();
</script>
