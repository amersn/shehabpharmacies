<script>
// Firebase Cloud Messaging opt-in for authenticated GitHub Pages users.
let SHEHAB_FCM_LOADING=null;
function loadShehabFirebase(){if(SHEHAB_FCM_LOADING)return SHEHAB_FCM_LOADING;const task=(async()=>{for(const src of ['https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js','https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js'])await new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('تعذر تحميل Firebase SDK من خوادم Google'));document.head.appendChild(s)});if(!window.firebase)throw new Error('مكتبة Firebase لم تُحمّل');if(!firebase.apps.length)firebase.initializeApp(SHEHAB_FIREBASE_CONFIG);if(!await firebase.messaging.isSupported())throw new Error('إشعارات الويب غير مدعومة في هذا المتصفح أو الجهاز');const msg=firebase.messaging();msg.onMessage(p=>{storePushNotification(p);const n=p.notification||{},t=n.title||'صيدليات شهاب',b=n.body||'لديك تحديث جديد';if(document.visibilityState==='hidden'&&Notification.permission==='granted')new Notification(t,{body:b,icon:'icon-192.png'});else showShehabPushToast(t+(b?' — '+b:''))});return msg})();SHEHAB_FCM_LOADING=task.catch(e=>{SHEHAB_FCM_LOADING=null;throw e});return SHEHAB_FCM_LOADING}
function showShehabPushToast(text,duration=4500){let e=document.getElementById('shehabPushToast');if(!e){e=document.createElement('div');e.id='shehabPushToast';e.style.cssText='position:fixed;z-index:99999;bottom:18px;left:12px;right:12px;max-width:500px;margin:auto;padding:14px 16px;background:#0b2a6f;color:white;border-radius:12px;box-shadow:0 4px 18px #0004;white-space:pre-wrap';document.body.appendChild(e)}e.textContent=text;e.hidden=false;clearTimeout(window.__shehabPushToastTimer);window.__shehabPushToastTimer=setTimeout(()=>e.hidden=true,duration)}
async function enableShehabPush(b){if(!S.t){showShehabPushToast('سجّل الدخول أولًا لتفعيل الإشعارات');return}if(!window.isSecureContext||!('serviceWorker'in navigator)||!('Notification'in window)){showShehabPushToast('افتح التطبيق من GitHub Pages على اتصال آمن لتفعيل الإشعارات');return}let stage='التحقق من المتصفح';try{b.disabled=true;b.textContent='جاري التفعيل…';if(Notification.permission==='denied')throw new Error('إذن الإشعارات مرفوض من إعدادات المتصفح');stage='طلب إذن الإشعارات';const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(permission!=='granted')throw new Error('لم يتم السماح بالإشعارات');stage='تحميل Firebase';const msg=await loadShehabFirebase();stage='تسجيل عامل الخدمة';const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await navigator.serviceWorker.ready;stage='إنشاء رمز الجهاز في Firebase';const token=await msg.getToken({vapidKey:SHEHAB_FIREBASE_CONFIG.vapidKey,serviceWorkerRegistration:reg});if(!token)throw new Error('Firebase لم يُرجع رمزًا للجهاز');stage='حفظ رمز الجهاز في Apps Script';await call('pushRegister',{token});localStorage.setItem('shehab_push_enabled','1');b.textContent='✅ الإشعارات مفعّلة على هذا الجهاز';showShehabPushToast('تم تفعيل إشعارات صيدليات شهاب على هذا الجهاز');refreshNotificationBadge()}catch(e){b.disabled=false;b.textContent='🔔 تفعيل الإشعارات';const detail=e&&e.message?e.message:typeof e==='string'?e:'خطأ غير معروف';showShehabPushToast('تعذر التفعيل — '+stage+': '+String(detail).slice(0,220),9000)}}

.nav-item .lbl{display:none;font-size:13px}
.nav-item.active{color:var(--btext);background:var(--soft)}
html.dark .nav-item.active{background:#1c2744}
.nav-item.active .icn{display:none}
.nav-item.active .lbl{display:inline}
.nav-item svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-count{position:absolute;top:-5px;right:-9px;min-width:18px;height:18px;padding:0 4px;border-radius:10px;background:#d32f2f;color:#fff;font:700 11px/18px system-ui;text-align:center}
.nav-fab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:62px;height:62px;min-width:62px;margin:0;padding:0;border-radius:50%;background:var(--b);color:#fff;font-size:34px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 8px 18px #00000040;border:4px solid var(--bg);z-index:56}
#toastBox{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#14213d;color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;font-weight:700;box-shadow:0 6px 18px #00000040;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;max-width:90%}
.toast.on{opacity:1;transform:translateY(0)}
.toast.ok{background:#138447}
.toast.err{background:#b3261e}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.swatch{width:38px;height:38px;min-width:38px;border-radius:50%;border:3px solid transparent;margin:0;padding:0;box-shadow:0 1px 4px #0003;cursor:pointer}
.swatch.on{border-color:var(--fg)}
.theme-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--soft2);margin:8px 0;font-weight:700}
.theme-row input{width:auto;margin:0}
.skl{background:linear-gradient(90deg,#e9eef7 25%,#f5f8fd 37%,#e9eef7 63%);background-size:400% 100%;animation:skl 1.2s ease infinite;border-radius:10px;height:14px;margin:8px 0}
html.dark .skl{background:linear-gradient(90deg,#1b2540 25%,#243052 37%,#1b2540 63%);background-size:400% 100%}
.skl-card{border-radius:12px;padding:12px;margin:10px 0;border:1px solid var(--line)}
@keyframes skl{0%{background-position:100% 0}100%{background-position:0 0}}
.offer-actionbar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:54;display:flex;justify-content:center;pointer-events:none}
.offer-actionbar button{pointer-events:auto;max-width:min(100% - 32px,488px);box-shadow:0 6px 18px #0003}
</style>
<script>
(function(){
function q(id){return document.getElementById(id)}
function toast(msg,type){try{var box=q('toastBox');if(!box){box=document.createElement('div');box.id='toastBox';document.body.appendChild(box)}var t=document.createElement('div');t.className='toast '+(type||'');t.textContent=String(msg);box.appendChild(t);requestAnimationFrame(function(){t.classList.add('on')});setTimeout(function(){t.classList.remove('on');setTimeout(function(){try{if(t.parentNode)t.parentNode.removeChild(t)}catch(e){}},260)},2600)}catch(e){}}
window.toast=toast;window.alert=function(m){toast(m)};
function setDark(on){try{localStorage.setItem('shehab_dark',on?'1':'0')}catch(e){}document.documentElement.classList.toggle('dark',!!on)}
function accentNow(){var cur='#0b2a6f';try{cur=localStorage.getItem('shehab_accent')||'#0b2a6f'}catch(e){}return cur}
function themeSyncUI(){var d=q('darkToggle');if(d)d.checked=document.documentElement.classList.contains('dark');var cur=accentNow();var l=document.querySelectorAll('.swatch');for(var i=0;i<l.length;i++)l[i].classList.toggle('on',l[i].getAttribute('data-c')===cur)}
function setAccent(c){try{localStorage.setItem('shehab_accent',c)}catch(e){}document.documentElement.style.setProperty('--b',c);themeSyncUI()}
window.setDark=setDark;window.setAccent=setAccent;
/* ---- علاجي الشهري: محفوظ على السيرفر (مع احتياطي محلي) ---- */
var MON_SERVER=false,MON=[];
function monthlyLocalKey(){return 'shehab_monthly_'+(S&&S.n?S.n:'u')}
function monthlyLocalLoad(){try{var v=JSON.parse(localStorage.getItem(monthlyLocalKey())||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}}
function monthlyLocalSave(l){try{localStorage.setItem(monthlyLocalKey(),JSON.stringify(l))}catch(e){}}
function monthlyRender(){var box=q('mList');if(!box)return;var l=MON||[];var c=q('mCount');if(c)c.textContent=l.length;if(!l.length){box.innerHTML=`<div class='card'>لسه مفيش أصناف — ضيف علاجك الشهري وهيتحفظ على حسابك وتشوفه الصيدلية.</div>`;return}box.innerHTML=l.map(function(it,i){return `<div class='card'><b>${esc(it.n)}</b><div class='rating-note'>${esc(it.u)} · الكمية ${it.q}</div><button type='button' class='g' data-del='${i}'>🗑️ حذف</button></div>`}).join('');var ds=box.querySelectorAll('[data-del]');for(var i=0;i<ds.length;i++)ds[i].addEventListener('click',function(){monthlyDel(Number(this.getAttribute('data-del')))})}
async function monthlyDel(i){var it=MON[i];if(!it)return;if(MON_SERVER&&it.id){try{await call('monthlyRemove',{id:it.id})}catch(x){toast(em(x),'bad');return}}MON.splice(i,1);if(!MON_SERVER)monthlyLocalSave(MON);monthlyRender();toast('اتحذف من القائمة','ok')}
async function monthlyAdd(){var nm=q('mName'),n=String(nm&&nm.value||'').trim(),u=q('mUnit')?q('mUnit').value:'علبة',qv=Math.floor(Number((q('mQty')&&q('mQty').value)||1)),btn=q('mAdd');if(!n){q('mErr').textContent='اكتب اسم الصنف الأول';return}if(!(qv>=1&&qv<=999)){q('mErr').textContent='راجع الكمية (من 1 لـ 999)';return}try{btn.disabled=true;var row={n:n,u:u,q:qv};if(MON_SERVER){row=await call('monthlyAdd',{name:n,unit:u,qty:qv})}MON.push({id:(row&&row.id)||'',n:(row&&row.n)||n,u:(row&&row.u)||u,q:Number((row&&row.q)||qv)});if(!MON_SERVER)monthlyLocalSave(MON);nm.value='';var qq=q('mQty');if(qq)qq.value='1';q('mErr').textContent='';monthlyRender();toast('اتضاف للقائمة ✔','ok')}catch(x){q('mErr').textContent=em(x)}finally{btn.disabled=false}}
async function monthlyLoadItems(){try{var l=await call('monthlyList');MON_SERVER=true;return (Array.isArray(l)?l:[]).map(function(x){return{id:String(x.id||''),n:x.n,u:x.u,q:Number(x.q)||1}})}catch(e){MON_SERVER=false;return monthlyLocalLoad()}}
function monthlyV(){V='monthly';app(`<div class='list-head'><h2>🗓️ علاجي الشهري</h2><span class='chip' id='mCount'>0</span></div><small>سجّل علاجك الشهري (الاسم + الوحدة + الكمية) وهيتحفظ على حسابك وتشوفه الصيدلية — وتقدر تطلبه في أي وقت.</small><div class='card'><label>اسم الصنف</label><input id='mName' maxlength='120' placeholder='مثال: كونكور 5 مجم'><div class='row' style='align-items:flex-end'><div><label>الوحدة</label><select id='mUnit'><option value='علبة'>علبة</option><option value='شريط'>شريط</option></select></div><div><label>الكمية</label><input id='mQty' type='number' min='1' max='999' step='1' value='1' inputmode='numeric'></div></div><button id='mAdd'>➕ إضافة للقائمة</button><div class='err' id='mErr'></div></div><div id='mList'>جاري التحميل…</div><button class='g' onclick='profileV()'>⬅️ رجوع لحسابي</button>`);q('mAdd').addEventListener('click',function(){monthlyAdd()});q('mName').addEventListener('keydown',function(ev){if(ev.key==='Enter')monthlyAdd()});navSync();(async function(){MON=await monthlyLoadItems();monthlyRender()})()}
/* ---- القوائم الشهرية للصيدلية (للموظفين) ---- */
async function monthlyAdminOrder(c,b){if(!c)return;var item=(c.items||[]).map(function(it){return it.n+' — '+it.u+' × '+it.q}).join('\n');if(!item)return;if(!confirm('أعمل أوردر بالأصناف دي للعميل '+(c.name||c.phone)+'؟'))return;try{b.disabled=true;b.textContent='جاري الإرسال…';await call('add',{item:item,cust:c.name||c.phone,cph:c.phone});toast('اتعمل أوردر جديد ✔','ok');setTimeout(function(){try{listV()}catch(e){}},700)}catch(x){toast(em(x),'bad');b.disabled=false;b.textContent='🛒 عمل أوردر'}}
function monthlyAdminRender(list){var box=q('mAll');if(!box)return;if(!list.length){box.innerHTML=`<div class='card'>مفيش قوائم شهرية مسجّلة لحد الآن.</div>`;return}box.innerHTML=list.map(function(c,i){return `<div class='card'><b>${esc(c.name||'عميل')}</b><div class='rating-note'>${esc(c.phone)} · ${(c.items||[]).length} صنف</div>${(c.items||[]).map(function(it){return `<div class='rating-note'>• ${esc(it.n)} — ${esc(it.u)} × ${it.q}</div>`}).join('')}<button class='g' data-i='${i}' data-act='order'>🛒 عمل أوردر</button></div>`}).join('');var bs=box.querySelectorAll('[data-act="order"]');for(var i=0;i<bs.length;i++)bs[i].addEventListener('click',function(){monthlyAdminOrder(list[Number(this.getAttribute('data-i'))],this)})}
function monthlyAdminV(){if(S&&S.r==='customer'){monthlyV();return}V='monthlyAll';app(`<div class='list-head'><h2>🗓️ القوائم الشهرية</h2></div><small>قوائم علاج العملاء الشهرية — تقدر تعمل أوردر بأصناف أي عميل بضغطة.</small><div id='mAll'>جاري التحميل…</div><button class='g' onclick='profileV()'>⬅️ رجوع لحسابي</button>`);navSync();(async function(){try{var l=await call('monthlyAll');monthlyAdminRender(Array.isArray(l)?l:[])}catch(x){var box=q('mAll');if(box)box.textContent=em(x)}})()}
/* ---- زرار إعادة الطلب لكل المستخدمين (للطلبات اللي اتسلّمت) ---- */
async function repeatOrder(id,b){if(!confirm('أعمل طلب جديد بنفس أصناف الطلب ده؟'))return;try{b.disabled=true;b.textContent='جاري الإرسال…';await call('repeat',{id:id});toast('تم إنشاء طلب جديد بنفس الأصناف ✔','ok');setTimeout(function(){try{if(V=='list')refreshOrders();else if(V=='mine')mineV()}catch(e){}},600)}catch(x){toast(em(x),'bad');b.disabled=false;b.textContent='🔁 إعادة الطلب'}}
function injectRepeat(){try{if(V!='list'&&V!='mine')return;var done='تم التسليم للعميل';try{if(typeof ST!=='undefined'&&ST.done&&ST.done[0])done=ST.done[0]}catch(e){}var cards=document.querySelectorAll('#ls .card[data-oid]');for(var i=0;i<cards.length;i++){var c=cards[i];if(c.querySelector('.repeat-btn'))continue;var chip=c.querySelector('.chip');if(!chip||String(chip.textContent||'').trim()!=done)continue;var b=document.createElement('button');b.type='button';b.className='g repeat-btn';b.textContent='🔁 إعادة الطلب';(function(bb,oid){bb.addEventListener('click',function(ev){ev.stopPropagation();repeatOrder(oid,bb)})})(b,c.getAttribute('data-oid'));c.appendChild(b)}}catch(e){}}
window.monthlyV=monthlyV;window.monthlyAdminV=monthlyAdminV;
var I={home:`<svg viewBox='0 0 24 24'><path d='M3 10.5 12 3l9 7.5'/><path d='M5 9.5V21h14V9.5'/><path d='M9.5 21v-6h5v6'/></svg>`,pct:`<svg viewBox='0 0 24 24'><line x1='19' y1='5' x2='5' y2='19'/><circle cx='7.5' cy='7.5' r='2.5'/><circle cx='16.5' cy='16.5' r='2.5'/></svg>`,basket:`<svg viewBox='0 0 24 24'><path d='M4 6h16l-1.6 11a2 2 0 0 1-2 1.7H7.6a2 2 0 0 1-2-1.7Z'/><path d='M9 6 12 2.5 15 6'/><path d='M9.5 11.5v4M14.5 11.5v4'/></svg>`,user:`<svg viewBox='0 0 24 24'><circle cx='12' cy='8' r='3.6'/><path d='M4.8 20a7.2 7.2 0 0 1 14.4 0'/></svg>`};
function buildNav(){if(q('nav'))return;var nav=document.createElement('nav');nav.id='nav';function item(t,icon,label){var b=document.createElement('button');b.className='nav-item';b.setAttribute('data-t',t);b.setAttribute('aria-label',label);var ic=document.createElement('span');ic.className='icn';ic.innerHTML=icon;var lb=document.createElement('span');lb.className='lbl';lb.textContent=label;b.appendChild(ic);b.appendChild(lb);b.addEventListener('click',function(){navGo(t)});return b}var mine=item('mine',I.basket,'طلباتي');mine.querySelector('.lbl').id='navMineLbl';var fab=document.createElement('button');fab.className='nav-fab';fab.setAttribute('aria-label','عمل أوردر');fab.textContent='+';fab.addEventListener('click',function(){navFab()});nav.appendChild(item('home',I.home,'الرئيسية'));nav.appendChild(item('off',I.pct,'العروض'));nav.appendChild(fab);nav.appendChild(mine);nav.appendChild(item('profile',I.user,'حسابي'));document.body.appendChild(nav)}
function navGo(t){try{if(t==='home')homeV();else if(t==='off')offV();else if(t==='mine'){if(S.r==='customer')mineV();else listV()}else if(t==='profile')profileV()}catch(e){}navSync()}
function navFab(){try{if(S.r==='customer')ordV();else addV()}catch(e){}navSync()}
function navCount(){}
function navSync(){var n=q('nav');if(!n)return;var logged=false;try{logged=!!(S&&S.t)}catch(e){}n.hidden=!logged;if(!logged)return;var staff=false;try{staff=(S.r!=='customer')}catch(e){}var lbl=q('navMineLbl');if(lbl)lbl.textContent=staff?'الطلبات':'طلباتي';var v='';try{v=V||''}catch(e){}var cur={home:'home',off:'off',offer:'off',mine:'mine',list:'mine',profile:'profile',monthly:'profile',monthlyAll:'profile',cart:'off'}[v]||'';var it=n.querySelectorAll('.nav-item');for(var i=0;i<it.length;i++)it[i].classList.toggle('active',it[i].getAttribute('data-t')===cur);navCount()}
window.navGo=navGo;window.navFab=navFab;window.navSync=navSync;
try{var cbBase=cartBadge;cartBadge=function(){cbBase();navCount()}}catch(e){}
function watchApp(){var ap=q('app');if(!ap||!window.MutationObserver)return;new MutationObserver(function(){navSync()}).observe(ap,{childList:true,subtree:false});var t=0;new MutationObserver(function(){if(t)return;t=setTimeout(function(){t=0;injectRepeat()},90)}).observe(ap,{childList:true,subtree:true})}
function heroCardHTML(o){return `<div class='hero-card' data-oid='${esc(o.id)}'>${o.ic?`<img src='${esc(o.ic)}' alt=''>`:''}<b>${esc(o.t)}</b>${prices(o)}${o.x?`<small>${esc(o.x)}</small>`:''}<div class='rating-note'>⭐ ${o.avg?o.avg.toFixed(1):'—'} · ${o.count||0}</div></div>`}
function heroClick(ev){var st=ev.target.closest('[data-step]');if(st&&st.getAttribute){stepHero(Number(st.getAttribute('data-step')));return}var c=ev.target.closest('.hero-card');if(c&&c.getAttribute('data-oid'))offerV(c.getAttribute('data-oid'))}
try{drawHero=function(){var e=q('of');if(!e)return;var a=featuredOffers();if(!a.length){e.innerHTML=`<div class='card'>مفيش عروض مميزة حاليًا</div>`;return}HI=(HI+a.length)%a.length;var pair=a.length>1?[a[HI],a[(HI+1)%a.length]]:[a[HI]];e.innerHTML=`<div class='hero-grid'>${pair.map(heroCardHTML).join('')}</div><div class='hero-note'><button type='button' class='g hero-mini' data-step='-1' aria-label='السابق'>‹</button><span>${HI+1} / ${a.length} · اضغط للتفاصيل</span><button type='button' class='g hero-mini' data-step='1' aria-label='التالي'>›</button></div>`;if(!e.dataset.hooked){e.dataset.hooked='1';e.addEventListener('click',heroClick)}};stepHero=function(d){var a=featuredOffers();if(a.length<2)return;HI=(HI+d+a.length)%a.length;var e=q('of');var g=e?e.querySelector('.hero-grid'):null;if(g){g.style.transition='opacity .15s,transform .15s';g.style.opacity='0';g.style.transform='translateX('+(d>0?'-':'+')+'14px)'}setTimeout(drawHero,150)}}catch(e){}
var OFF_Q='';
try{var drawOBase=drawO;drawO=function(){if(!OFF_Q){drawOBase();return}var all=OF;try{OF=all.filter(function(o){return String(o.t||'').toLowerCase().indexOf(OFF_Q)>-1||String(o.x||'').toLowerCase().indexOf(OFF_Q)>-1})}catch(e){}drawOBase();OF=all};var offVBase=offV;offV=async function(){await offVBase();var ap=q('app');var hd=ap?ap.querySelector('h2'):null;if(hd&&!q('offSearch')){OFF_Q='';var box=document.createElement('div');box.innerHTML=`<input id='offSearch' placeholder='🔍 دوّر على عرض بالاسم' autocomplete='off'>`;hd.insertAdjacentElement('afterend',box.firstChild);var inp=q('offSearch');inp.value='';inp.addEventListener('input',function(){OFF_Q=String(inp.value||'').trim().toLowerCase();try{drawO()}catch(e){}})}}}catch(e){}
try{var pvBase=profileV;profileV=async function(){await pvBase();var p=q('profile');if(!p||q('appearanceBox'))return;var box=document.createElement('div');box.className='profile-field';box.id='appearanceBox';var colors=['#0b2a6f','#0a5ea4','#0e7c66','#33691e','#7b2ff7','#b3261e','#c2185b','#4a4f57'];box.innerHTML=`<h3 style='margin:6px 0'>🎨 إعدادات الشكل</h3><label class='theme-row'><input type='checkbox' id='darkToggle'> الوضع الليلي 🌙</label><small>لون التطبيق</small><div class='swatches'>${colors.map(function(c){return `<button type='button' class='swatch' data-c='${c}' style='background:${c}' aria-label='لون'></button>`}).join('')}</div><small>الاختيار بيتحفظ على الجهاز.</small>`;var mb=document.createElement('button');mb.type='button';mb.className='g';mb.textContent=(S&&S.r!=='customer')?'🗓️ القوائم الشهرية (العملاء)':'🗓️ علاجي الشهري';mb.addEventListener('click',function(){if(S&&S.r!=='customer')monthlyAdminV();else monthlyV()});p.appendChild(mb);p.appendChild(box);var dt=q('darkToggle');if(dt)dt.addEventListener('change',function(){setDark(dt.checked)});var sw=box.querySelectorAll('.swatch');for(var i=0;i<sw.length;i++)(function(s){s.addEventListener('click',function(){setAccent(s.getAttribute('data-c'))})})(sw[i]);themeSyncUI()}}catch(e){}
try{var ovBase=offerV;offerV=function(id,fromCache){ovBase(id,fromCache);try{if(!S||S.r!=='customer')return;var ap=q('app');if(!ap||!ap.querySelector)return;var card=ap.querySelector('.card');if(!card)return;var btns=card.querySelectorAll('button');var cartBtn=null;for(var i=0;i<btns.length;i++){if(String(btns[i].textContent||'').indexOf('سلة')>-1){cartBtn=btns[i];break}}if(!cartBtn)return;var bar=document.createElement('div');bar.className='offer-actionbar';cartBtn.parentNode.removeChild(cartBtn);bar.appendChild(cartBtn);ap.appendChild(bar)}catch(e){}}}catch(e){}
function boot(){buildNav();watchApp();navSync();themeSyncUI()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
