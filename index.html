<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نواقص العملاء</title><meta name="theme-color" content="#0b2a6f"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="النواقص">
<style>
:root{--b:#0b2a6f}*{box-sizing:border-box}[hidden]{display:none!important}

#app{max-width:520px;margin:auto;padding:16px}

input,select,button,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1.5px solid #c9d3ea;margin:5px 0;background:#fff;color:inherit}

.m>div{background:#fff;width:100%;max-width:520px;margin:auto auto 0;padding:16px;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto}.hs{padding:4px 2px 10px}.hero-shell{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:6px;align-items:center}.hero-arrow{width:42px;height:48px;padding:6px;font-size:24px}.hero-card{background:#eef2fb;border:1.5px solid #c9d3ea;border-radius:14px;padding:14px;min-height:190px;cursor:pointer;text-align:center;transition:opacity .18s,transform .18s}.hero-card img{width:100%;height:150px;object-fit:contain;border-radius:10px}.hero-card b{display:block;margin-top:8px}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:56px}.topbar .lg{height:76px;margin:0 auto 0 0}.person{width:46px;height:46px;border-radius:50%;font-size:23px;padding:4px;flex:0 0 auto}.offer-card{cursor:pointer}.offer-photo{display:block;width:min(100%,320px);height:260px;object-fit:contain;margin:10px auto;border-radius:14px;background:#f7f9fc}.stars{display:flex;justify-content:center;gap:4px;margin:10px 0}.stars button{width:auto;padding:6px 9px;font-size:25px;background:transparent;color:#b8bfcc;margin:0}.stars button.on{color:#f4b400}.rating-note{text-align:center;color:#667;font-size:13px}.featured-toggle{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#eef2fb;margin:8px 0}.featured-toggle input{width:auto;margin:0}.profile-field{background:#f7f9fc;border-radius:10px;padding:10px;margin:8px 0}.profile-field small{display:block}.profile-field strong{overflow-wrap:anywhere}.card b,.m b,.pw{white-space:pre-wrap}.offer-prices{display:flex;align-items:baseline;gap:9px;margin:8px 0 4px}.offer-now{color:#138447;font-size:21px;font-weight:800}.offer-was{color:#7b8495;text-decoration:line-through;font-size:14px}.offer-prices small{font-size:12px;color:#56627a}
.pw2{position:relative}.pw2 input{padding-left:46px}.pw2 span{position:absolute;left:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:20px;user-select:none}.ic{width:30px;height:30px;border-radius:7px;object-fit:cover;vertical-align:middle;margin-inline-end:6px}button.lk{background:none;color:var(--b);border:0;text-decoration:underline;font-weight:400;width:auto;padding:6px}
.err{color:#d32f2f;min-height:22px}small{color:#667}
</style></head><body><div id="app"></div><script src="config.js"></script><script>
const LOGO='logo.png';
const LS=(()=>{try{localStorage.getItem('x');return localStorage}catch(e){return{clear(){}}}})();
const ST={new:['جديد','#2e9e4f'],unavailable:['مش متوفر','#d32f2f'],ordered:['تم الطلب وفي الطريق','#1e5fd6'],arrived:['وصل وموجود في الصيدلية','#f57c00'],done:['تم التسليم للعميل','#b0b7c3']};
const RL={manager:'مدير',pharmacist:'صيدلي',assistant:'مساعد',customer:'عميل'};
let S={t:LS.t||'',n:LS.n||'',r:LS.r||''},O=[],V='';
const $=i=>document.getElementById(i),app=h=>{const root=$('app'),view=V||'view';if(NAV_READY){history.replaceState({appScreen:root.innerHTML,appView:location.hash.slice(1)},'',location.href);history.pushState({appScreen:h,appView:view},'','#'+view)}else{history.replaceState({appScreen:h,appView:view},'','#'+view);NAV_READY=true}root.innerHTML=h};let NAV_READY=false;onpopstate=e=>{if(e.state&&e.state.appScreen!==undefined){V=e.state.appView||'auth';$('app').innerHTML=e.state.appScreen}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

const GS=!!(window.google&&google.script&&google.script.run);
const call=async(a,o={})=>{const b=JSON.stringify({a,t:S.t,...o});
if(GS)return new Promise((ok,no)=>google.script.run.withSuccessHandler(r=>{r=JSON.parse(r);r.ok?ok(r.data):no(r.err)}).withFailureHandler(()=>no(new Error('x'))).api(b));
if(typeof API=='undefined'||API.includes('PASTE'))throw 'رابط الخادم لسه ما اتحطش في ملف config.js';
const r=await(await fetch(API,{method:'POST',body:b})).json();if(!r.ok)throw r.err;return r.data};
const fmt=(t,o)=>new Date(t).toLocaleString('ar-EG',o);
const out=()=>{LS.clear();S={t:'',n:'',r:''};authV()};let OF=[],MD='',IC,DP,HI=0,ORIGIN='home';
const ed=()=>S.r=='manager'||S.r=='pharmacist',ef=e=>fmt(e,{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'});const rc=()=>{const v=$('r').value;$('ad').hidden=v!='customer';$('ed').hidden=!['customer','manager','pharmacist'].includes(v);$('cd').hidden=v!='manager'};
const PW=(id,ph)=>`<div class="pw2"><input id="${id}" type="password" placeholder="${ph}"><span onclick="eye('${id}')">👁</span></div>`;
const eye=id=>{const i=$(id);i.type=i.type=='password'?'text':'password'};
function whatsapp(){const message='السلام عليكم، أرغب في الاستفسار عن منتج أو شرح الأعراض للصيدلي.';const url='https://wa.me/201154017470?text='+encodeURIComponent(message);window.open(url,'_blank','noopener');}function fpV(){V='fp';app(`<img class="lg" src="${LOGO}"><h2>نسيت كلمة السر</h2><small>اكتب رقم تليفونك وهيجيلك كود على الواتساب</small><input id="p" type="tel" placeholder="رقم التليفون"><div class="err" id="e"></div><button onclick="fpS(this)">إرسال الكود</button>`)}
async function fpS(b){try{b.disabled=1;const p=$('p').value;await call('forgot',{phone:p});rsV(p)}catch(x){$('e').textContent=em(x);b.disabled=0}}
function rsV(p){V='rs';app(`<img class="lg" src="${LOGO}"><h2>كلمة سر جديدة</h2><small>اكتب الكود اللي وصلك على الواتساب وكلمة السر الجديدة. لو الكود ما وصلش كلّم الصيدلية.</small><input id="cv" type="tel" inputmode="numeric" placeholder="الكود (6 أرقام)">${PW('w','كلمة السر الجديدة')}<div class="err" id="e"></div><button onclick="rsS('${esc(p)}',this)">تغيير كلمة السر</button>`)}
async function rsS(p,b){try{b.disabled=1;await call('reset',{phone:p,code:$('cv').value,pass:$('w').value});authV();$('e').textContent='تم تغيير كلمة السر ✔ سجّل دخول'}catch(x){$('e').textContent=em(x);b.disabled=0}}
function authV(m='in'){V='auth';const u=m=='up';app(`<img class="lg" src="${LOGO}"><div class="row"><button class="${u?'g':''}" onclick="authV('in')">دخول</button><button class="${u?'':'g'}" onclick="authV('up')">حساب جديد</button></div>${u?`<small>نوع الحساب</small><select id="r" onchange="rc()"><option value="customer">عميل</option><option value="pharmacist">صيدلي</option><option value="assistant">مساعد</option><option value="manager">مدير</option></select><input id="n" placeholder="الاسم ثنائي">`:''}<input id="p" type="tel" placeholder="رقم التليفون">${u?`<input id="ad" placeholder="العنوان"><div id="ed"><input id="eml" type="email" autocomplete="email" placeholder="البريد الإلكتروني (اختياري لتحديثات الطلب)"></div><input id="cd" type="password" hidden placeholder="كود المدير السري">`:''}${PW('w','الباسورد')}<div class="err" id="e"></div><button onclick="go('${m}')">${u?'تسجيل':'دخول'}</button>${u?'':'<button class="lk" onclick="fpV()">نسيت كلمة السر؟</button><button class="g" onclick="whatsapp()">💬 تواصل عبر واتساب</button><small>هتفتح المحادثة برسالة جاهزة وتقدر تراجعها قبل الإرسال</small>'}`)}
async function go(m){try{const d={phone:$('p').value,pass:$('w').value};
if(m=='up'){Object.assign(d,{name:$('n').value,role:$('r').value,code:$('cd').value,addr:$('ad').value,email:$('eml').value});
const x=await call('signup',d);if(x.status=='pending'){authV('in');$('e').textContent='تم التسجيل ✔ استنى موافقة المدير على حسابك';return}S={t:x.token,n:x.name,r:x.role};Object.assign(LS,S);homeV();return}
const x=await call('login',d);S={t:x.token,n:x.name,r:x.role};Object.assign(LS,S);homeV()}catch(x){$('e').textContent=em(x)}}function homeV(m=''){V='home';const c=S.r=='customer';app(`<div class="topbar"><button class="g person" onclick="profileV()" aria-label="حسابي" title="حسابي">👤</button><img class="lg" src="${LOGO}"><span style="width:46px"></span></div><h2>أهلاً ${esc(S.n)} <small>(${RL[S.r]})</small></h2><div style="color:#2e9e4f;font-weight:700">${m}</div><div class="row" style="align-items:center"><h2 style="margin:0">🎁 العروض</h2><button class="g" style="flex:0 0 auto;width:auto" onclick="offV()">مشاهدة جميع العروض</button></div><div class="hs" id="of">جاري التحميل…</div><button class="big" onclick="${c?'ordV()':'addV()'}">${c?'🛒 طلب أصناف':'➕ إضافة صنف'}</button><button class="big" onclick="${c?'mineV()':'listV()'}">📋 ${c?'عرض طلباتي':'عرض الطلبات'}</button>${c?'<button class="g" onclick="notifV()">🔔 إعدادات إشعارات الطلبات</button>':''}<button id="ib" class="g" hidden onclick="inst()">📲 تثبيت التطبيق</button><small id="ih" hidden>لتثبيت التطبيق على الأيفون: اضغط زرار المشاركة ثم Add to Home Screen</small><button class="g" onclick="whatsapp()">💬 استفسار أو شرح الأعراض عبر واتساب</button><button class="g" onclick="out()">تسجيل خروج</button>`);loadO();hint()}
async function profileV(){V='profile';app(`<h2>👤 حسابي</h2><div id="profile">جاري تحميل بيانات الحساب…</div>`);try{const u=await call('profile');$('profile').innerHTML=`<div class="profile-field"><small>الاسم</small><strong>${esc(u.name)||'—'}</strong></div><div class="profile-field"><small>رقم التليفون</small><strong dir="ltr">${esc(u.phone)||'—'}</strong></div><div class="profile-field"><small>العنوان</small><strong>${esc(u.address)||'—'}</strong></div><label for="profileEmail">البريد الإلكتروني (اختياري)</label><input id="profileEmail" type="email" autocomplete="email" placeholder="البريد الإلكتروني" value="${esc(u.email)}"><div class="err" id="profileErr"></div><button onclick="saveProfileEmail(this)">حفظ البريد</button>`}catch(x){$('profile').textContent=em(x)}}
async function saveProfileEmail(b){try{b.disabled=1;await call('setEmail',{email:$('profileEmail').value});$('profileErr').textContent='تم حفظ البريد ✔'}catch(x){$('profileErr').textContent=em(x)}finally{b.disabled=0}}async function notifV(){V='notify';app(`<h2>🔔 إشعارات الطلبات</h2><small>البريد اختياري. أضفه لو حابب توصلك رسالة عند تسجيل الطلب أو تحديث حالته. يمكنك ربط تيليجرام أيضًا.</small><input id="notifyEmail" type="email" autocomplete="email" placeholder="البريد الإلكتروني (اختياري)"><button onclick="saveNotifyEmail(this)">حفظ البريد</button><div id="ne" class="err"></div><hr><div id="tgstatus">جاري تحميل حالة تيليجرام…</div><button class="g" onclick="makeTelegramLink(this)">ربط حساب Telegram</button><p><a id="tgurl" hidden target="_blank" rel="noopener">افتح رابط الربط في Telegram واضغط Start</a></p><small>لا يمكن للبوت إرسال رسالة قبل أن تبدأه. كل رابط ربط صالح لعشر دقائق ولمرة واحدة.</small>`);try{const s=await call('settings');$('notifyEmail').value=s.email||'';$('tgstatus').textContent=s.telegram?'✅ Telegram مربوط بهذا الحساب':'Telegram غير مربوط'}catch(x){$('tgstatus').textContent=em(x)}}
async function saveNotifyEmail(b){try{b.disabled=1;await call('setEmail',{email:$('notifyEmail').value});$('ne').textContent='تم حفظ البريد ✔'}catch(x){$('ne').textContent=em(x)}finally{b.disabled=0}}
async function makeTelegramLink(b){try{b.disabled=1;const x=await call('tgLink');$('tgurl').href=x.url;$('tgurl').hidden=false;$('tgstatus').textContent='اضغط الرابط ثم Start لإتمام الربط'}catch(x){$('ne').textContent=em(x)}finally{b.disabled=0}}async function loadO(){try{OF=await call('offers');if(HI>=featuredOffers().length)HI=0;drawHero()}catch(x){const e=$('of');if(e)e.textContent=em(x)}}
const featuredOffers=()=>OF.filter(o=>o.f);
function drawHero(){const e=$('of');if(!e)return;const a=featuredOffers();if(!a.length){e.innerHTML='<div class="card">مفيش عروض مميزة حاليًا</div>';return}HI=(HI+a.length)%a.length;const o=a[HI];e.innerHTML=`<div class="hero-shell"><button class="g hero-arrow" onclick="stepHero(-1)" aria-label="العرض السابق">‹</button><div class="hero-card" onclick="offerV('${esc(o.id)}')">${o.ic?`<img src="${esc(o.ic)}" alt="">`:''}<b>${esc(o.t)}</b>${prices(o)}${o.x?`<small>${esc(o.x)}</small>`:''}<div class="rating-note">⭐ ${o.avg?o.avg.toFixed(1):'—'} · ${o.count||0} تقييم</div></div><button class="g hero-arrow" onclick="stepHero(1)" aria-label="العرض التالي">›</button></div><div class="rating-note">${HI+1} / ${a.length} · اضغط على العرض للتفاصيل</div>`}
function stepHero(d){const a=featuredOffers();if(a.length<2)return;HI=(HI+d+a.length)%a.length;const c=$('of').querySelector('.hero-card');if(c){c.style.opacity='0';c.style.transform=`translateX(${d>0?'-':'+'}12px)`}setTimeout(drawHero,130)}async function offV(){V='off';app(`<h2>🎁 كل العروض</h2>${ed()?'<button onclick="offE()">➕ إضافة عرض</button>':''}<div id="ol">جاري التحميل…</div>`);try{OF=await call('offers');drawO()}catch(x){$('ol').textContent=em(x)}}function drawO(){$('ol').innerHTML=OF.map(o=>`<div class="card offer-card" style="border-color:#0b2a6f" onclick="offerV('${esc(o.id)}')">${o.ic?`<img class="ic" src="${esc(o.ic)}">`:''}<b>${esc(o.t)}</b>${prices(o)}${o.x?`<br><span class="pw">${esc(o.x)}</span>`:''}<div class="rating-note">⭐ ${o.avg?o.avg.toFixed(1):'—'} · ${o.count||0} تقييم</div>${ed()?`<label class="featured-toggle" onclick="event.stopPropagation()"><input type="checkbox" ${o.f?'checked':''} onchange="featureOffer('${esc(o.id)}',this)"> إظهار في الرئيسية</label><button class="g" onclick="event.stopPropagation();offE('${esc(o.id)}')">تعديل</button>`:''}</div>`).join('')||'مفيش عروض حاليًا'}
async function featureOffer(id,el){try{await call('feature',{id,featured:el.checked});const o=OF.find(x=>x.id==id);if(o)o.f=el.checked;HI=0;drawHero()}catch(x){el.checked=!el.checked;alert(em(x))}}
function offerV(id,fromCache=false){if(!fromCache&&V!='offer')ORIGIN=V;const o=OF.find(x=>x.id==id);if(!o)return;V='offer';app(`<div class="card">${o.ic?`<img class="offer-photo" src="${esc(o.ic)}" alt="${esc(o.t)}">`:''}<h2>${esc(o.t)}</h2>${prices(o)}<h3>المواصفات والتفاصيل</h3><div class="pw">${esc(o.x)||'لا توجد تفاصيل إضافية'}</div><h3>تقييم العملاء</h3><div class="rating-note">${o.avg?o.avg.toFixed(1):'—'} من 5 · ${o.count||0} تقييم</div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=(o.mine||0)?'on':''}" aria-label="${n} نجوم" onclick="rateOffer('${esc(o.id)}',${n})">★</button>`).join('')}</div><div class="rating-note">اختار من نجمة إلى خمس نجوم</div>${ed()?`<button class="g" onclick="offE('${esc(o.id)}')">تعديل العرض</button>`:''}</div>`)}
function offerBack(){if(ORIGIN=='home')homeV();else offV()}
async function rateOffer(id,stars){try{await call('rate',{id,stars});OF=await call('offers');offerV(id,true);drawHero()}catch(x){alert(em(x))}}
const prices=o=>o.p?`<div class="offer-prices"><span class="offer-now">${esc(o.p)} <small>جنيه</small></span>${o.w?`<span class="offer-was">${esc(o.w)} جنيه</span>`:''}</div>`:'';
const ico=o=>o.ic?`<img class="ic" src="${esc(o.ic)}">`:'';const icn=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onerror=()=>ok('');i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.fillStyle='#fff';x.fillRect(0,0,256,256);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,256,256);ok(c.toDataURL('image/jpeg',.65))};i.src=r.result};r.readAsDataURL(f)});
const ipick=async i=>{if(i.files[0]){IC=await icn(i.files[0]);$('op').innerHTML=IC?`<img class="ic" src="${IC}">`:''}};
function offE(id){IC=undefined;const o=OF.find(x=>x.id==id)||{},m=document.createElement('div');m.className='m';m.id='md';m.innerHTML=`<div><b>${id?'تعديل العرض':'عرض جديد'}</b><input id="ot" placeholder="عنوان العرض" value="${esc(o.t)}"><input id="oprice" type="number" min="0" step="0.01" placeholder="السعر الحالي بالجنيه" value="${esc(o.p)}"><input id="ooldprice" type="number" min="0" step="0.01" placeholder="السعر قبل الخصم (اختياري)" value="${esc(o.w)}"><textarea id="ox" rows="4" placeholder="المواصفات والتفاصيل (اختياري)">${esc(o.x)}</textarea><label class="featured-toggle"><input id="ofeatured" type="checkbox" ${o.f?'checked':''}> إظهار العرض في الشاشة الرئيسية</label><small>صورة المنتج (اختياري)</small><div class="row" style="align-items:center"><span id="op" style="flex:0 0 auto">${ico(o)}</span><input type="file" accept="image/*" onchange="ipick(this)"><button class="g" style="flex:0 0 auto;width:auto" onclick="IC='';$('op').innerHTML=''">إزالة</button></div><div class="err" id="er"></div><button onclick="osave('${esc(id||'')}',this)">حفظ</button>${id?`<button class="g" onclick="odel('${esc(id)}',this)">حذف العرض</button>`:''}<button class="g" onclick="$('md').remove()">إغلاق</button></div>`;document.body.appendChild(m)}async function osave(id,b){try{const p=$('oprice').value,w=$('ooldprice').value;if(p&&w&&Number(w)<=Number(p))throw 'السعر قبل الخصم لازم يكون أكبر من السعر الحالي';b.disabled=1;await call('osave',{id,ti:$('ot').value,tx:$('ox').value,price:p,oldPrice:w,ic:IC,featured:$('ofeatured').checked});$('md').remove();OF=await call('offers');if(V=='off')drawO();drawHero()}catch(x){$('er').textContent=em(x);b.disabled=0}}
async function odel(id,b){if(!confirm('تحذف العرض؟'))return;try{b.disabled=1;await call('odel',{id});$('md').remove();OF=await call('offers');drawO()}catch(x){$('er').textContent=em(x);b.disabled=0}}
