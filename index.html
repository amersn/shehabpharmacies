<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نواقص العملاء</title><meta name="theme-color" content="#0b2a6f"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="النواقص">
<style>
:root{--b:#0b2a6f}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,Tahoma,sans-serif;background:#fff;color:#14213d;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:auto;padding:16px}
.lg{display:block;margin:0 auto 8px;height:110px}
h2{color:var(--b);margin:8px 0 12px}
input,select,button,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1.5px solid #c9d3ea;margin:5px 0;background:#fff;color:inherit}
button{background:var(--b);color:#fff;border:0;font-weight:700}
button.g{background:#eef2fb;color:var(--b)}button:disabled{opacity:.6}
.big{padding:26px;font-size:20px;margin:12px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.card{border-radius:12px;box-shadow:0 1px 6px #0b2a6f33;padding:12px;margin:10px 0;border-right:8px solid}
.chip{display:inline-block;color:#fff;border-radius:20px;padding:1px 10px;font-size:13px}
.m{position:fixed;inset:0;background:#0009;display:flex}
.m>div{background:#fff;width:100%;max-width:520px;margin:auto auto 0;padding:16px;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto}
.hs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px}.of{flex:0 0 72%;scroll-snap-align:start;background:#eef2fb;border:1.5px solid #c9d3ea;border-radius:12px;padding:12px}.card b,.m b,.pw{white-space:pre-wrap}.offer-prices{display:flex;align-items:baseline;gap:9px;margin:8px 0 4px}.offer-now{color:#138447;font-size:21px;font-weight:800}.offer-was{color:#7b8495;text-decoration:line-through;font-size:14px}.offer-prices small{font-size:12px;color:#56627a}
.pw2{position:relative}.pw2 input{padding-left:46px}.pw2 span{position:absolute;left:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:20px;user-select:none}.ic{width:30px;height:30px;border-radius:7px;object-fit:cover;vertical-align:middle;margin-inline-end:6px}button.lk{background:none;color:var(--b);border:0;text-decoration:underline;font-weight:400;width:auto;padding:6px}
.err{color:#d32f2f;min-height:22px}small{color:#667}
</style></head><body><div id="app"></div><script src="config.js"></script><script>
const LOGO='logo.png';
const LS=(()=>{try{localStorage.getItem('x');return localStorage}catch(e){return{clear(){}}}})();
const ST={new:['جديد','#2e9e4f'],unavailable:['مش متوفر','#d32f2f'],ordered:['تم الطلب وفي الطريق','#1e5fd6'],arrived:['وصل وموجود في الصيدلية','#f57c00'],done:['تم التسليم للعميل','#b0b7c3']};
const RL={manager:'مدير',pharmacist:'صيدلي',assistant:'مساعد',customer:'عميل'};
let S={t:LS.t||'',n:LS.n||'',r:LS.r||''},O=[],V='';
const $=i=>document.getElementById(i),app=h=>$('app').innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const em=x=>typeof x=='string'?x:'تأكد من الاتصال بالإنترنت';
const GS=!!(window.google&&google.script&&google.script.run);
const call=async(a,o={})=>{const b=JSON.stringify({a,t:S.t,...o});
if(GS)return new Promise((ok,no)=>google.script.run.withSuccessHandler(r=>{r=JSON.parse(r);r.ok?ok(r.data):no(r.err)}).withFailureHandler(()=>no(new Error('x'))).api(b));
if(typeof API=='undefined'||API.includes('PASTE'))throw 'رابط الخادم لسه ما اتحطش في ملف config.js';
const r=await(await fetch(API,{method:'POST',body:b})).json();if(!r.ok)throw r.err;return r.data};
const fmt=(t,o)=>new Date(t).toLocaleString('ar-EG',o);
const out=()=>{LS.clear();S={t:'',n:'',r:''};authV()};

let OF=[],MD='',IC,DP;
const ed=()=>S.r=='manager'||S.r=='pharmacist',ef=e=>fmt(e,{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'});const rc=()=>{const v=$('r').value;$('ad').hidden=v!='customer';$('ed').hidden=!['customer','manager','pharmacist'].includes(v);$('cd').hidden=v!='manager'};
const PW=(id,ph)=>`<div class="pw2"><input id="${id}" type="password" placeholder="${ph}"><span onclick="eye('${id}')">👁</span></div>`;
const eye=id=>{const i=$(id);i.type=i.type=='password'?'text':'password'};
function fpV(){V='fp';app(`<img class="lg" src="${LOGO}"><h2>نسيت كلمة السر</h2><small>اكتب رقم تليفونك وهيجيلك كود على الواتساب</small><input id="p" type="tel" placeholder="رقم التليفون"><div class="err" id="e"></div><button onclick="fpS(this)">إرسال الكود</button><button class="g" onclick="authV()">رجوع</button>`)}
async function fpS(b){try{b.disabled=1;const p=$('p').value;await call('forgot',{phone:p});rsV(p)}catch(x){$('e').textContent=em(x);b.disabled=0}}
function rsV(p){V='rs';app(`<img class="lg" src="${LOGO}"><h2>كلمة سر جديدة</h2><small>اكتب الكود اللي وصلك على الواتساب وكلمة السر الجديدة. لو الكود ما وصلش كلّم الصيدلية.</small><input id="cv" type="tel" inputmode="numeric" placeholder="الكود (6 أرقام)">${PW('w','كلمة السر الجديدة')}<div class="err" id="e"></div><button onclick="rsS('${esc(p)}',this)">تغيير كلمة السر</button><button class="g" onclick="authV()">رجوع</button>`)}
async function rsS(p,b){try{b.disabled=1;await call('reset',{phone:p,code:$('cv').value,pass:$('w').value});authV();$('e').textContent='تم تغيير كلمة السر ✔ سجّل دخول'}catch(x){$('e').textContent=em(x);b.disabled=0}}
function authV(m='in'){V='auth';const u=m=='up';app(`<img class="lg" src="${LOGO}"><div class="row"><button class="${u?'g':''}" onclick="authV('in')">دخول</button><button class="${u?'':'g'}" onclick="authV('up')">حساب جديد</button></div>${u?`<small>نوع الحساب</small><select id="r" onchange="rc()"><option value="customer">عميل</option><option value="pharmacist">صيدلي</option><option value="assistant">مساعد</option><option value="manager">مدير</option></select><input id="n" placeholder="الاسم ثنائي">`:''}<input id="p" type="tel" placeholder="رقم التليفون">${u?`<input id="ad" placeholder="العنوان"><div id="ed"><input id="eml" type="email" autocomplete="email" placeholder="البريد الإلكتروني (اختياري لتحديثات الطلب)"></div><input id="cd" type="password" hidden placeholder="كود المدير السري">`:''}${PW('w','الباسورد')}<div class="err" id="e"></div><button onclick="go('${m}')">${u?'تسجيل':'دخول'}</button>${u?'':'<button class="lk" onclick="fpV()">نسيت كلمة السر؟</button>'}`)}
async function go(m){try{const d={phone:$('p').value,pass:$('w').value};
if(m=='up'){Object.assign(d,{name:$('n').value,role:$('r').value,code:$('cd').value,addr:$('ad').value,email:$('eml').value});
const x=await call('signup',d);if(x.status=='pending'){authV('in');$('e').textContent='تم التسجيل ✔ استنى موافقة المدير على حسابك';return}S={t:x.token,n:x.name,r:x.role};Object.assign(LS,S);homeV();return}
const x=await call('login',d);S={t:x.token,n:x.name,r:x.role};Object.assign(LS,S);homeV()}catch(x){$('e').textContent=em(x)}}

function homeV(m=''){V='home';const c=S.r=='customer';app(`<img class="lg" src="${LOGO}"><h2>أهلاً ${esc(S.n)} <small>(${RL[S.r]})</small></h2><div style="color:#2e9e4f;font-weight:700">${m}</div><div class="row" style="align-items:center"><h2 style="margin:0">🎁 العروض</h2><button class="g" style="flex:0 0 auto;width:auto" onclick="offV()">مشاهدة جميع العروض</button></div><div class="hs" id="of">جاري التحميل…</div><button class="big" onclick="${c?'ordV()':'addV()'}">${c?'🛒 طلب أصناف':'➕ إضافة صنف'}</button><button class="big" onclick="${c?'mineV()':'listV()'}">📋 ${c?'عرض طلباتي':'عرض الطلبات'}</button>${c?'<button class="g" onclick="notifV()">🔔 إعدادات إشعارات الطلبات</button>':''}<button id="ib" class="g" hidden onclick="inst()">📲 تثبيت التطبيق</button><small id="ih" hidden>لتثبيت التطبيق على الأيفون: اضغط زرار المشاركة ثم Add to Home Screen</small><button class="g" onclick="out()">تسجيل خروج</button>`);loadO();hint()}async function notifV(){V='notify';app(`<h2>🔔 إشعارات الطلبات</h2><small>البريد اختياري. أضفه لو حابب توصلك رسالة عند تسجيل الطلب أو تحديث حالته. يمكنك ربط تيليجرام أيضًا.</small><input id="notifyEmail" type="email" autocomplete="email" placeholder="البريد الإلكتروني (اختياري)"><button onclick="saveNotifyEmail(this)">حفظ البريد</button><div id="ne" class="err"></div><hr><div id="tgstatus">جاري تحميل حالة تيليجرام…</div><button class="g" onclick="makeTelegramLink(this)">ربط حساب Telegram</button><p><a id="tgurl" hidden target="_blank" rel="noopener">افتح رابط الربط في Telegram واضغط Start</a></p><small>لا يمكن للبوت إرسال رسالة قبل أن تبدأه. كل رابط ربط صالح لعشر دقائق ولمرة واحدة.</small><button class="g" onclick="homeV()">رجوع</button>`);try{const s=await call('settings');$('notifyEmail').value=s.email||'';$('tgstatus').textContent=s.telegram?'✅ Telegram مربوط بهذا الحساب':'Telegram غير مربوط'}catch(x){$('tgstatus').textContent=em(x)}}
async function saveNotifyEmail(b){try{b.disabled=1;await call('setEmail',{email:$('notifyEmail').value});$('ne').textContent='تم حفظ البريد ✔'}catch(x){$('ne').textContent=em(x)}finally{b.disabled=0}}
async function makeTelegramLink(b){try{b.disabled=1;const x=await call('tgLink');$('tgurl').href=x.url;$('tgurl').hidden=false;$('tgstatus').textContent='اضغط الرابط ثم Start لإتمام الربط'}catch(x){$('ne').textContent=em(x)}finally{b.disabled=0}}
async function loadO(){try{OF=await call('offers');const e=$('of');if(e)e.innerHTML=OF.slice(0,10).map(o=>`<div class="of"><b>${ico(o)}${esc(o.t)}</b>${prices(o)}${o.x?`<br><small class="pw">${esc(o.x)}</small>`:''}</div>`).join('')||'<small>مفيش عروض حاليًا</small>'}catch(x){const e=$('of');if(e)e.textContent=em(x)}}
async function offV(){V='off';app(`<h2>🎁 كل العروض</h2>${ed()?'<button onclick="offE()">➕ إضافة عرض</button>':''}<div id="ol">جاري التحميل…</div><button class="g" onclick="homeV()">رجوع</button>`);try{OF=await call('offers');drawO()}catch(x){$('ol').textContent=em(x)}}function drawO(){$('ol').innerHTML=OF.map(o=>`<div class="card" style="border-color:#0b2a6f"><b>${ico(o)}${esc(o.t)}</b>${prices(o)}${o.x?`<br><span class="pw">${esc(o.x)}</span>`:''}${ed()?`<br><button class="g" onclick="offE('${esc(o.id)}')">تعديل</button>`:''}</div>`).join('')||'مفيش عروض حاليًا'}
const prices=o=>o.p?`<div class="offer-prices"><span class="offer-now">${esc(o.p)} <small>جنيه</small></span>${o.w?`<span class="offer-was">${esc(o.w)} جنيه</span>`:''}</div>`:'';
const ico=o=>o.ic?`<img class="ic" src="${esc(o.ic)}">`:'';
const icn=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onerror=()=>ok('');i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.fillStyle='#fff';x.fillRect(0,0,96,96);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);ok(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)});
const ipick=async i=>{if(i.files[0]){IC=await icn(i.files[0]);$('op').innerHTML=IC?`<img class="ic" src="${IC}">`:''}};
function offE(id){IC=undefined;const o=OF.find(x=>x.id==id)||{},m=document.createElement('div');m.className='m';m.id='md';m.innerHTML=`<div><b>${id?'تعديل العرض':'عرض جديد'}</b><input id="ot" placeholder="عنوان العرض" value="${esc(o.t)}"><input id="oprice" type="number" min="0" step="0.01" placeholder="السعر الحالي بالجنيه" value="${esc(o.p)}"><input id="ooldprice" type="number" min="0" step="0.01" placeholder="السعر قبل الخصم (اختياري)" value="${esc(o.w)}"><textarea id="ox" rows="4" placeholder="تفاصيل إضافية (اختياري)">${esc(o.x)}</textarea><small>أيقونة صغيرة (اختياري)</small><div class="row" style="align-items:center"><span id="op" style="flex:0 0 auto">${ico(o)}</span><input type="file" accept="image/*" onchange="ipick(this)"><button class="g" style="flex:0 0 auto;width:auto" onclick="IC='';$('op').innerHTML=''">إزالة</button></div><div class="err" id="er"></div><button onclick="osave('${esc(id||'')}',this)">حفظ</button>${id?`<button class="g" onclick="odel('${esc(id)}',this)">حذف العرض</button>`:''}<button class="g" onclick="$('md').remove()">إغلاق</button></div>`;document.body.appendChild(m)}async function osave(id,b){try{const p=$('oprice').value,w=$('ooldprice').value;if(p&&w&&Number(w)<=Number(p))throw 'السعر قبل الخصم لازم يكون أكبر من السعر الحالي';b.disabled=1;await call('osave',{id,ti:$('ot').value,tx:$('ox').value,price:p,oldPrice:w,ic:IC});$('md').remove();OF=await call('offers');drawO()}catch(x){$('er').textContent=em(x);b.disabled=0}}
async function odel(id,b){if(!confirm('تحذف العرض؟'))return;try{b.disabled=1;await call('odel',{id});$('md').remove();OF=await call('offers');drawO()}catch(x){$('er').textContent=em(x);b.disabled=0}}

function ordV(){V='ord';MD='';app(`<h2>طلب أصناف</h2><small>اكتب اسم الدواء. برجاء توضيح الكمية بجانب كل صنف (علبة أو شريط)، وكل صنف في سطر.</small><textarea id="it" rows="6" placeholder="مثال: بنادول اكسترا - 2 شريط"></textarea><div class="row"><button id="b1" class="g" onclick="mode('delivery')">🛵 توصيل</button><button id="b2" class="g" onclick="mode('pickup')">🏪 استلام من الصيدلية</button></div><div class="err" id="e"></div><button onclick="corder(this)">إرسال الطلب</button><button class="g" onclick="homeV()">رجوع</button>`)}
const mode=x=>{MD=x;$('b1').className=x=='delivery'?'':'g';$('b2').className=x=='pickup'?'':'g'};
async function corder(b){try{if(!$('it').value.trim())throw 'اكتب اسم الدواء';if(!MD)throw 'اختار توصيل أو استلام من الصيدلية';b.disabled=1;b.textContent='جاري الإرسال…';await call('corder',{item:$('it').value,mode:MD});homeV('تم إرسال طلبك ✔ تابعه من عرض طلباتي')}catch(x){$('e').textContent=em(x);b.disabled=0;b.textContent='إرسال الطلب'}}
async function mineV(){V='mine';app(`<h2>طلباتي</h2><div id="ls">جاري التحميل…</div><button class="g" onclick="mineV()">تحديث</button><button class="g" onclick="homeV()">رجوع</button>`);try{const L=await call('mine');$('ls').innerHTML=L.map(o=>{const t=ST[o.s]||ST.new;return`<div class="card" style="border-color:${t[1]}"><b>${esc(o.i)}</b><br><span class="chip" style="background:${t[1]}">${t[0]}</span><br><small>${fmt(o.d,{dateStyle:'medium',timeStyle:'short'})} — ${o.m=='delivery'?'🛵 توصيل':'🏪 استلام من الصيدلية'}</small>${o.s=='ordered'&&o.e?`<br>🚚 هيوصل: <b>${ef(o.e)}</b>`:''}</div>`}).join('')||'مفيش طلبات'}catch(x){$('ls').textContent=em(x)}}

function addV(){V='add';app(`<h2>إضافة صنف ناقص</h2><input id="i" placeholder="اسم الصنف"><input id="c" placeholder="اسم الشخص"><input id="ph" type="tel" placeholder="رقم التليفون"><small>صورة الصنف (اختياري)</small><input id="f" type="file" accept="image/*"><div class="err" id="e"></div><button onclick="save(this)">حفظ</button><button class="g" onclick="homeV()">رجوع</button>`)}
const img=f=>new Promise(ok=>{if(!f)return ok('');const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)});
async function save(b){try{b.disabled=1;b.textContent='جاري الحفظ…';await call('add',{item:$('i').value,cust:$('c').value,cph:$('ph').value,img:await img($('f').files[0])});homeV();alert('تم الحفظ ✔')}catch(x){$('e').textContent=em(x);b.disabled=0;b.textContent='حفظ'}}

async function listV(){V='list';app(`<h2>الطلبات</h2><input id="q" placeholder="بحث: اسم / تليفون / صنف" oninput="draw()"><div class="row"><select id="fl" onchange="draw()"><option value="">كل الحالات</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><select id="so" onchange="draw()"><option value="d">الأحدث</option><option value="o">الأقدم</option><option value="c">الاسم</option><option value="p">التليفون</option><option value="s">الحالة</option></select></div><div id="ls">جاري التحميل…</div><button class="g" onclick="listV()">تحديث</button><button class="g" onclick="homeV()">رجوع</button>`);try{O=await call('list');draw()}catch(x){$('ls').textContent=em(x)}}
function draw(){if(V!='list')return;const q=$('q').value.trim().toLowerCase(),f=$('fl').value,s=$('so').value,ks=Object.keys(ST);
const L=O.filter(o=>(!f||o.s==f)&&(!q||(o.i+o.c+o.p).toLowerCase().includes(q))).sort((a,b)=>s=='d'?b.d-a.d:s=='o'?a.d-b.d:s=='c'?a.c.localeCompare(b.c,'ar'):s=='p'?String(a.p).localeCompare(String(b.p)):ks.indexOf(a.s)-ks.indexOf(b.s));
$('ls').innerHTML=L.map(o=>{const t=ST[o.s]||ST.new;return`<div class="card" style="border-color:${t[1]}" onclick="openO('${esc(o.id)}')"><b>${esc(o.i)}</b> <span class="chip" style="background:${t[1]}">${t[0]}</span><br>${esc(o.c)} — <a href="tel:${esc(o.p)}" onclick="event.stopPropagation()">${esc(o.p)}</a><br><small>${fmt(o.d,{dateStyle:'medium',timeStyle:'short'})} — ${esc(o.by)}</small>${o.m?`<br>${o.m=='delivery'?'🛵 توصيل: '+esc(o.a):'🏪 استلام من الصيدلية'}`:''}${o.sr?`<br>📍 ${esc(o.sr)}`:''}${o.s=='ordered'&&o.e?`<br>🚚 هيوصل: <b>${fmt(o.e,{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})}</b>`:''}</div>`}).join('')||'مفيش طلبات'}
setInterval(async()=>{if(V=='list'&&!$('md')){try{O=await call('list');draw()}catch(x){}}},60000);

function openO(id){const o=O.find(x=>x.id==id),m=document.createElement('div');m.className='m';m.id='md';
m.innerHTML=`<div><b>${esc(o.i)}</b><br>${esc(o.c)} — ${esc(o.p)}${o.m?`<br>${o.m=='delivery'?'🛵 توصيل: '+esc(o.a):'🏪 استلام من الصيدلية'}`:''}${o.ph?`<button class="g" onclick="pic('${esc(o.ph)}',this)">عرض الصورة</button>`:''}${1?`<select id="ms" onchange="$('eb').hidden=this.value!='ordered'">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k==o.s?'selected':''}>${v[0]}</option>`).join('')}</select><input id="sr" placeholder="جاي منين؟ (المكان)" value="${esc(o.sr)}"><div id="eb" ${o.s=='ordered'?'':'hidden'}><small>ميعاد الوصول المتوقع</small><input id="me" type="datetime-local" value="${esc(o.e)}"><div class="row">${['النهارده','بكرا','بعد بكرا'].map((t,k)=>`<button class="g" onclick="dy(${k})">${t}</button>`).join('')}</div></div><button onclick="upd('${esc(o.id)}',this)">حفظ الحالة</button>`:'<br><small>تغيير الحالة للمدير والصيدلي فقط</small>'}<button class="g" onclick="$('md').remove()">إغلاق</button></div>`;document.body.appendChild(m)}
const dy=k=>{const d=new Date(Date.now()+k*864e5),p=n=>String(n).padStart(2,'0'),t=($('me').value||'T17:00').split('T')[1];$('me').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${t}`};
async function upd(id,b){try{b.disabled=1;await call('upd',{id,s:$('ms').value,e:$('me').value,sr:$('sr').value});$('md').remove();listV()}catch(x){alert(em(x));b.disabled=0}}
async function pic(id,b){b.textContent='…';try{b.outerHTML=`<img src="${await call('photo',{id})}" style="width:100%;border-radius:10px;margin:6px 0">`}catch(x){b.textContent=em(x)}}

const hint=()=>{if(GS)return;const b=$('ib'),h=$('ih');if(DP&&b)b.hidden=false;if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone&&h)h.hidden=false};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;hint()});
addEventListener('appinstalled',()=>{DP=null;const b=$('ib');if(b)b.hidden=true});
async function inst(){if(!DP)return;DP.prompt();await DP.userChoice;DP=null;const b=$('ib');if(b)b.hidden=true}
if(!GS&&'serviceWorker'in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{if(!S.t)return authV();try{await call('me');homeV()}catch(x){typeof x=='string'?out():homeV()}})();
</script></body></html>
